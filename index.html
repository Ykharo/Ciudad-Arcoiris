<title>Ciudad Arcoíris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --ink:#26315C; --ink-soft:#6B7199; --paper:#FFFDF8; --line:#EFE8F1;
    --pink:#FF6FAE; --pink-d:#D94E8C; --sun:#FFC93C; --sun-d:#DDA21A;
    --mint:#34CFA0; --mint-d:#1FA67E; --sky:#55B6F5; --sky-d:#3690CE;
    --coral:#FF7A59; --coral-d:#D95A3B;
    --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{margin:0;background:#9FD8FF;color:var(--ink);font-family:var(--body);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;}
  #game{position:fixed;inset:0;overflow:hidden;}
  #c{display:block;width:100%;height:100%;touch-action:none;}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button:focus-visible{outline:4px solid var(--sky);outline-offset:3px;}

  /* ---------- toy buttons ---------- */
  .toy{--bg:#fff;--bd:#D9D3E6;--fg:var(--ink);
    font:800 18px/1 var(--display);color:var(--fg);background:var(--bg);border:3px solid rgba(255,255,255,.9);
    border-radius:999px;padding:12px 20px 10px;box-shadow:0 5px 0 var(--bd),0 10px 22px rgba(38,49,92,.18);
    transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;}
  .toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(38,49,92,.18);}
  .toy.pink{--bg:var(--pink);--bd:var(--pink-d);--fg:#fff;}
  .toy.sun{--bg:var(--sun);--bd:var(--sun-d);--fg:var(--ink);}
  .toy.mint{--bg:var(--mint);--bd:var(--mint-d);--fg:#fff;}
  .toy.sky{--bg:var(--sky);--bd:var(--sky-d);--fg:#fff;}
  .toy.coral{--bg:var(--coral);--bd:var(--coral-d);--fg:#fff;}
  .toy .em{font-size:22px;line-height:1;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #hud > *{pointer-events:auto;}
  #place{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
    font:800 17px/1 var(--display);background:rgba(255,253,248,.92);padding:10px 16px 8px;border-radius:999px;
    border:3px solid #fff;box-shadow:0 4px 0 rgba(38,49,92,.12);display:flex;align-items:center;gap:8px;pointer-events:none;}
  #place .dot{width:12px;height:12px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px #FFD6E8;}
  #topright{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:10px;}
  .round{width:58px;height:58px;padding:0;border-radius:50%;font-size:26px;}
  .round.off{--bg:#E8E4EE;--bd:#C9C2D6;}

  #joy{position:absolute;left:calc(30px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
    width:156px;height:156px;border-radius:50%;background:rgba(255,255,255,.32);border:4px solid rgba(255,255,255,.9);
    box-shadow:0 6px 0 rgba(38,49,92,.14), inset 0 0 0 10px rgba(255,255,255,.18);touch-action:none;}
  #joy::before{content:"";position:absolute;inset:34px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);}
  #joyKnob{position:absolute;left:50%;top:50%;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff 0 18%,#FF9CC7 19% 100%);border:4px solid #fff;
    box-shadow:0 5px 0 var(--pink-d),0 10px 20px rgba(38,49,92,.25);pointer-events:none;}
  #joyHint{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:800 14px/1 var(--display);color:#fff;
    text-shadow:0 2px 0 rgba(38,49,92,.35);white-space:nowrap;pointer-events:none;}

  #actions{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:flex-end;gap:14px;}
  #actionRow{display:flex;align-items:flex-end;gap:14px;}
  #menuBtns{display:flex;flex-direction:column;gap:12px;align-items:stretch;}
  #btnJump{width:104px;height:104px;border-radius:50%;flex-direction:column;gap:2px;font-size:17px;padding:0;}
  #btnJump .em{font-size:34px;}
  #btnAction{font-size:21px;padding:16px 24px 13px;animation:bob 1.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #btnAction:active{animation:none;}

  #toast{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);
    font:800 19px/1.1 var(--display);background:var(--paper);border:4px solid #fff;padding:12px 22px 10px;border-radius:999px;
    box-shadow:0 5px 0 rgba(38,49,92,.14),0 12px 30px rgba(38,49,92,.2);transition:transform .35s cubic-bezier(.2,1.4,.4,1);
    pointer-events:none;max-width:calc(100% - 32px);text-align:center;white-space:normal;}
  #toast.show{transform:translate(-50%,0);}

  #game.menu #joy,#game.menu #actions,#game.menu #place{display:none;}
  #driveBtns{display:none;align-items:flex-end;gap:14px;}
  #driveCol{display:flex;flex-direction:column;gap:12px;align-items:stretch;}
  #game.driving #driveBtns{display:flex;}
  #game.driving #actionRow,#game.driving #btnAction{display:none;}
  #btnBrake{width:104px;height:104px;border-radius:50%;flex-direction:column;gap:2px;font-size:17px;padding:0;}
  #btnBrake .em{font-size:32px;}
  #btnBrake.held{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(38,49,92,.18);}
  .opt svg{display:block;width:56px;height:28px;}
  #game.intro #hud{display:none;}

  /* ---------- panels ---------- */
  .panel{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(430px,44vw);background:var(--paper);border-radius:30px;
    border:4px solid #fff;box-shadow:0 10px 0 rgba(38,49,92,.12),0 24px 60px rgba(38,49,92,.28);display:flex;flex-direction:column;
    overflow:hidden;animation:slideIn .4s cubic-bezier(.2,1.25,.4,1);}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 14px 22px;color:#fff;}
  #closet .phead{background:var(--pink);}
  #petPanel .phead{background:var(--mint);}
  .phead h2{margin:0;font:800 30px/1 var(--display);letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.12);padding-top:4px;}
  .phead .toy{font-size:17px;padding:10px 18px 8px;}
  #tabs{display:flex;gap:8px;padding:14px 16px 10px;overflow-x:auto;flex:none;touch-action:pan-x;scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none;border:0;background:#F4EEF6;color:var(--ink);font:800 17px/1 var(--display);padding:11px 16px 9px;border-radius:999px;}
  .tab.on{background:var(--ink);color:#fff;}
  .pbody{flex:1;overflow-y:auto;padding:4px 18px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
  .pbody h3{margin:16px 0 10px;font:800 13px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);}
  .pbody p.note{margin:6px 0 0;font:700 14px/1.4 var(--body);color:var(--ink-soft);}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
  .opt{border:3px solid var(--line);background:#fff;border-radius:18px;min-height:74px;padding:8px 6px 6px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font:700 14px/1.1 var(--body);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:center;}
  .opt .ic{font-size:26px;line-height:1;}
  .opt.on{border-color:var(--pink);background:#FFF0F7;box-shadow:0 3px 0 #FFB8D6;}
  #petPanel .opt.on{border-color:var(--mint);background:#EAFBF4;box-shadow:0 3px 0 #9DE8CF;}
  .opt:active{transform:translateY(2px);}
  .sws{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #E2DAEA,0 3px 0 rgba(38,49,92,.12);padding:0;}
  .sw.on{box-shadow:0 0 0 4px var(--ink),0 3px 0 rgba(38,49,92,.12);transform:scale(1.06);}
  .pfoot{flex:none;display:flex;gap:10px;padding:12px 16px 16px;border-top:3px solid var(--line);background:#fff;}
  .pfoot .toy{flex:1;}
  #petName{width:100%;box-sizing:border-box;font:700 19px/1 var(--body);color:var(--ink);padding:14px 16px;border-radius:16px;border:3px solid var(--line);
    background:#fff;-webkit-user-select:text;user-select:text;touch-action:manipulation;}
  #petName:focus{outline:none;border-color:var(--mint);}
  .mypets{display:flex;flex-direction:column;gap:8px;}
  .mypet{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 8px 8px 12px;}
  .mypet .ic{font-size:28px;}
  .mypet b{flex:1;font:800 18px/1 var(--display);padding-top:3px;}
  .mypet .toy{font-size:14px;padding:9px 14px 7px;}
  .empty{font:700 15px/1.4 var(--body);color:var(--ink-soft);margin:0;}

  /* ---------- start screen ---------- */
  #start{position:absolute;inset:0;display:grid;place-items:center;padding:16px;
    background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.15),rgba(80,150,220,.25));}
  .card{width:min(540px,100%);box-sizing:border-box;background:rgba(255,253,248,.94);border:5px solid #fff;border-radius:40px;
    padding:30px 32px 28px;text-align:center;box-shadow:0 12px 0 rgba(38,49,92,.12),0 30px 80px rgba(38,49,92,.3);}
  .card h1{margin:0;font:800 clamp(44px,8vw,68px)/.95 var(--display);letter-spacing:-.01em;text-wrap:balance;
    background:linear-gradient(90deg,#FF5E7E,#FF9B4A 22%,#F5C518 40%,#3CC96A 58%,#3FA7F0 76%,#9B6BF0);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(38,49,92,.16));padding-top:8px;}
  .card .sub{margin:10px auto 22px;max-width:36ch;font:700 18px/1.45 var(--body);color:var(--ink);}
  .card .toy{font-size:26px;padding:18px 40px 15px;}
  .how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:22px 0 0;padding:0;list-style:none;font:700 14px/1.3 var(--body);color:var(--ink-soft);}
  .how li{display:flex;align-items:center;gap:6px;}
  .how b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#F4EEF6;font-size:14px;}

  @media (max-width:760px), (orientation:portrait) and (max-width:1000px){
    .panel{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));top:auto;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;height:min(58%,560px);border-radius:26px;}
    .phead h2{font-size:26px;}
    @keyframes slideIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  }
  @media (max-width:560px){
    #joy{width:130px;height:130px;left:18px;bottom:22px;}
    #joy::before{inset:28px;}
    #joyKnob{width:58px;height:58px;}
    #btnJump{width:86px;height:86px;}
    #btnBrake{width:86px;height:86px;}
    #actions{right:14px;bottom:20px;gap:10px;}
    #menuBtns{gap:9px;}
    .toy{font-size:15px;padding:10px 14px 8px;}
    #place{font-size:14px;}
  }
  @media (prefers-reduced-motion:reduce){
    #btnAction{animation:none;} .panel{animation:none;} #toast{transition:none;}
  }
</style>

<div id="game" class="intro">
  <canvas id="c" aria-label="Ciudad en 3D"></canvas>

  <div id="hud">
    <div id="place"><span class="dot"></span><span id="placeName">Calle Arcoíris</span></div>
    <div id="topright">
      <button id="btnMusic" class="toy round" aria-label="Música">🎵</button>
    </div>
    <div id="joy" aria-label="Mover"><span id="joyHint">¡Mueve aquí!</span><div id="joyKnob"></div></div>
    <div id="actions">
      <button id="btnAction" class="toy sun" hidden></button>
      <div id="actionRow">
        <div id="menuBtns">
          <button id="btnCloset" class="toy pink"><span class="em">👗</span>Vestidor</button>
          <button id="btnPets" class="toy mint"><span class="em">🐾</span>Mascotas</button>
          <button id="btnWave" class="toy"><span class="em">👋</span>Saludar</button>
        </div>
        <button id="btnJump" class="toy sky"><span class="em">⬆</span>Saltar</button>
      </div>
      <div id="driveBtns">
        <div id="driveCol">
          <button id="btnHorn" class="toy sun"><span class="em">📯</span>Bocina</button>
          <button id="btnExit" class="toy"><span class="em">🚪</span>Bajarse</button>
        </div>
        <button id="btnBrake" class="toy coral"><span class="em">✋</span>Frenar</button>
      </div>
    </div>
    <div id="toast" role="status"></div>
  </div>

  <aside id="closet" class="panel" hidden>
    <div class="phead"><h2>Vestidor</h2><button id="closetDone" class="toy">Listo</button></div>
    <div id="tabs"></div>
    <div id="closetBody" class="pbody"></div>
    <div class="pfoot">
      <button id="btnRandom" class="toy sun"><span class="em">✨</span>Sorpréndeme</button>
    </div>
  </aside>

  <aside id="petPanel" class="panel" hidden>
    <div class="phead"><h2>Refugio de Mascotas</h2><button id="petDone" class="toy">Listo</button></div>
    <div id="petBody" class="pbody"></div>
    <div class="pfoot">
      <button id="btnAdopt" class="toy mint"><span class="em">💚</span>Adoptar</button>
    </div>
  </aside>

  <div id="start">
    <div class="card">
      <h1>Ciudad Arcoíris</h1>
      <p class="sub">Pasea por la ciudad, cámbiate de ropa en el vestidor y adopta mascotas que te acompañen.</p>
      <button id="btnPlay" class="toy pink" disabled>Construyendo la ciudad…</button>
      <ul class="how">
        <li><b>🕹</b>Círculo: caminar</li>
        <li><b>👆</b>Arrastra: girar la cámara</li>
        <li><b>🤏</b>Pellizca: acercar</li>
      </ul>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>window.addEventListener('error',function(e){var b=document.getElementById('btnPlay');if(b&&b.disabled){b.textContent=typeof THREE==='undefined'?'No se pudo cargar el 3D. Revisa tu conexión.':'Algo falló al construir la ciudad';}});</script>
<script>
'use strict';
/* ================= ENGINE & HELPERS ================= */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function lerpAngle(a, b, t) { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xC4E8FF, 80, 210);
const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 600);

const hemi = new THREE.HemisphereLight(0xE8F5FF, 0xD6D9B8, 0.85);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0xFFF3EA, 0.3); // soft light from the camera so faces never go murky
scene.add(fill, fill.target);
const sun = new THREE.DirectionalLight(0xFFF0D8, 0.95);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{ const sc = sun.shadow.camera; sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34; sc.near = 1; sc.far = 140; }
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.035;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(32, 58, 26);

/* materials + geometry caches */
const matCache = new Map();
function mat(color, opts) {
  const key = color + '|' + (opts ? JSON.stringify(opts) : '');
  let m = matCache.get(key);
  if (!m) { m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.72, metalness: 0 }, opts || {})); matCache.set(key, m); }
  return m;
}
function shade(hex, k) { const c = new THREE.Color(hex); c.multiplyScalar(k); return '#' + c.getHexString(); }
const geoCache = new Map();
function G(key, fn) { let g = geoCache.get(key); if (!g) { g = fn(); geoCache.set(key, g); } return g; }
const box = (w, h, d) => G(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const sph = (r, ws = 20, hs = 14) => G(`s${r},${ws},${hs}`, () => new THREE.SphereGeometry(r, ws, hs));
const cyl = (rt, rb, h, s = 20) => G(`c${rt},${rb},${h},${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s));
const cone = (r, h, s = 16) => G(`k${r},${h},${s}`, () => new THREE.ConeGeometry(r, h, s));

/* rounded box with analytic normals — the soft "toy" look */
function rbox(w, h, d, r, seg = 6) {
  r = Math.min(r, w / 2, h / 2, d / 2) * 0.999;
  return G(`rb${w},${h},${d},${r},${seg}`, () => {
    const g = new THREE.BoxGeometry(1, 1, 1, seg, seg, seg);
    const p = g.attributes.position, n = g.attributes.normal;
    const half = [w / 2, h / 2, d / 2];
    const v = new THREE.Vector3();
    const c = [0, 0, 0], out = [0, 0, 0], inner = [0, 0, 0];
    for (let i = 0; i < p.count; i++) {
      c[0] = p.getX(i); c[1] = p.getY(i); c[2] = p.getZ(i);
      for (let a = 0; a < 3; a++) {
        const idx = Math.round((c[a] + 0.5) * seg), H = half[a];
        const map = seg === 6 ? [-H, -H + r / 2, -H + r, 0, H - r, H - r / 2, H] : [-H, -H + r, 0, H - r, H];
        out[a] = map[idx];
        inner[a] = clamp(out[a], -(H - r), H - r);
      }
      v.set(out[0] - inner[0], out[1] - inner[1], out[2] - inner[2]);
      if (v.lengthSq() > 1e-10) v.normalize(); else v.set(0, 1, 0);
      p.setXYZ(i, inner[0] + v.x * r, inner[1] + v.y * r, inner[2] + v.z * r);
      n.setXYZ(i, v.x, v.y, v.z);
    }
    return g;
  });
}
const rlo = (w, h, d, r) => rbox(w, h, d, r, 4);

function mesh(geo, m, x = 0, y = 0, z = 0, cast = true, recv = true) {
  const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = recv; return o;
}

/* merge static meshes by material -> few draw calls */
function mergeInto(root, meshes, useLocal) {
  const buckets = new Map();
  for (const o of meshes) {
    let b = buckets.get(o.material);
    if (!b) { b = { geos: [], cast: false }; buckets.set(o.material, b); }
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(useLocal ? o.matrix : o.matrixWorld);
    b.geos.push(g); b.cast = b.cast || o.castShadow;
    o.parent.remove(o);
  }
  const made = [];
  buckets.forEach((b, m) => {
    let n = 0; b.geos.forEach(g => n += g.attributes.position.count);
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
    let off = 0;
    b.geos.forEach(g => { pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); off += g.attributes.position.count; g.dispose(); });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.computeBoundingSphere();
    const mm = new THREE.Mesh(geo, m); mm.castShadow = b.cast; mm.receiveShadow = true;
    root.add(mm); made.push(mm);
  });
  return made;
}
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const list = [];
  (function walk(o) {
    if (o.userData.dynamic) return;
    if (o.isMesh && !o.isInstancedMesh && !o.material.map && !o.material.transparent) list.push(o);
    o.children.forEach(walk);

/* canvas text textures */
function roundRect(x, X, y, w, h, r) { x.beginPath(); x.moveTo(X + r, y); x.arcTo(X + w, y, X + w, y + h, r); x.arcTo(X + w, y + h, X, y + h, r); x.arcTo(X, y + h, X, y, r); x.arcTo(X, y, X + w, y, r); x.closePath(); }
function signTexture(text, bg, fg, w = 1024, h = 220) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  roundRect(x, 8, 8, w - 16, h - 16, 60); x.fillStyle = '#FFFFFF'; x.fill();
  roundRect(x, 22, 22, w - 44, h - 44, 48); x.fillStyle = bg; x.fill();
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  let size = 120; x.font = `800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`;
  while (x.measureText(text).width > w - 110 && size > 40) { size -= 4; x.font = `800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`; }
  x.fillText(text, w / 2, h / 2 + size * 0.08);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function makeSign(text, bg, fg, width) {
  const tex = signTexture(text, bg, fg);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 220 / 1024), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, transparent: true }));
  return m;
}
const labelCache = new Map();
function labelSprite(text, opts = {}) {
  const key = text + (opts.bubble ? '|b' : '');
  let tex = labelCache.get(key);
  if (!tex) {
    const c = document.createElement('canvas'); const x = c.getContext('2d');
    const font = `800 56px "Baloo 2", "Trebuchet MS", sans-serif`; x.font = font;
    const tw = Math.ceil(x.measureText(text).width);
    c.width = tw + 70; c.height = opts.bubble ? 120 : 96;
    x.font = font;
    const h = 90;
    roundRect(x, 4, 4, c.width - 8, h - 8, 40); x.fillStyle = opts.bubble ? '#FFFFFF' : 'rgba(38,49,92,0.82)'; x.fill();
    if (opts.bubble) { x.lineWidth = 6; x.strokeStyle = '#26315C'; x.stroke(); x.beginPath(); x.moveTo(c.width / 2 - 14, h - 6); x.lineTo(c.width / 2, h + 22); x.lineTo(c.width / 2 + 14, h - 6); x.fillStyle = '#FFFFFF'; x.fill(); }
    x.fillStyle = opts.bubble ? '#26315C' : '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(text, c.width / 2, h / 2 + 4);
    tex = new THREE.CanvasTexture(c); tex.userData = { w: c.width, h: c.height };
    labelCache.set(key, tex);
  }
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: true, transparent: true, fog: false }));
  const k = opts.scale || 0.0085;
  s.scale.set(tex.userData.w * k, tex.userData.h * k, 1);
  s.renderOrder = 5;
  return s;
}

const world = new THREE.Group(); scene.add(world);

const LINES = [-40, 0, 40];
const ROAD_HALF = 3.5, WALK = 4.5, EXT = 76;
const STREET = { x: { '-40': 'Avenida Frutilla', '0': 'Calle Arcoíris', '40': 'Avenida Menta' }, z: { '-40': 'Calle Limón', '0': 'Paseo Algodón', '40': 'Calle Mora' } };

function grassTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#88D46F'; x.fillRect(0, 0, 256, 256);
  const r = seeded(7);
  for (let i = 0; i < 1100; i++) {
    x.fillStyle = ['#7ACB63', '#94DC7A', '#80CF67', '#9FE386', '#86D26C'][Math.floor(r() * 5)];
    const s = 2 + r() * 4; x.fillRect(r() * 256, r() * 256, s, s * 1.7);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(70, 70); t.anisotropy = 8; return t;
}
function stripeTexture(a, b, n = 8) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64; const x = c.getContext('2d');
  for (let i = 0; i < n; i++) { x.fillStyle = i % 2 ? b : a; x.fillRect(i * 256 / n, 0, 256 / n + 1, 64); }

function buildSky() {
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3E9CF0) }, mid: { value: new THREE.Color(0xA9DDFF) }, bot: { value: new THREE.Color(0xDDF3FF) } },
    vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 top,mid,bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.?mix(mid,top,smoothstep(0.,.55,h)):mix(mid,bot,smoothstep(0.,-.25,h));gl_FragColor=vec4(c,1.);}'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat);
  sky.renderOrder = -10;
  // sun glow
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.22, 'rgba(255,248,210,1)'); gr.addColorStop(0.35, 'rgba(255,236,170,.55)'); gr.addColorStop(1, 'rgba(255,230,160,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
  const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), fog: false, depthWrite: false, transparent: true }));
  sunSpr.scale.set(90, 90, 1); sunSpr.position.copy(SUN_OFF).normalize().multiplyScalar(360);
  sky.add(sunSpr);
  scene.add(sky);
  return sky;
}

function buildClouds() {
  const cm = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 1, emissive: 0xE8F4FF, emissiveIntensity: 0.35, fog: false });
  const clouds = [];
  const r = seeded(21);
  for (let i = 0; i < 10; i++) {
    const g = new THREE.Group();
    const n = 4 + Math.floor(r() * 3);
    for (let j = 0; j < n; j++) {
      const s = 3 + r() * 3.5;
      const m = new THREE.Mesh(sph(1, 16, 12), cm); m.scale.set(s * 1.25, s * 0.85, s);
      m.position.set((j - n / 2) * 3.4 + r() * 1.5, r() * 1.5, r() * 3 - 1.5); g.add(m);
    }
    g.position.set(r() * 320 - 160, 48 + r() * 22, r() * 320 - 160);
    g.userData.speed = 1.2 + r() * 1.5;
    scene.add(g); clouds.push(g);
  }
  animated.push((t, dt) => { for (const g of clouds) { g.position.x += g.userData.speed * dt; if (g.position.x > 180) g.position.x = -180; } });
}

function buildGround() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(460, 460), new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const roadM = mat('#606B85', { roughness: 0.95 }), walkM = mat('#F1E9DD', { roughness: 0.9 }), dashM = mat('#FFD466', { roughness: 0.8 }), whiteM = mat('#FFFFFF', { roughness: 0.8 });
  LINES.forEach((L, i) => {
    world.add(mesh(box(EXT * 2, 0.05, ROAD_HALF * 2), roadM, 0, 0.025 + i * 0.001, L, false, true));
    world.add(mesh(box(ROAD_HALF * 2, 0.05, EXT * 2), roadM, L, 0.03 + i * 0.001, 0, false, true));
  });
  const segs = [[-EXT, -45.5], [-34.5, -5.5], [5.5, 34.5], [45.5, EXT]];
  LINES.forEach(L => segs.forEach(([a, b]) => [-1, 1].forEach(s => {
    world.add(mesh(rlo(b - a, 0.18, 2, 0.06), walkM, (a + b) / 2, 0.09, L + s * WALK, false, true));
    world.add(mesh(rlo(2, 0.18, b - a, 0.06), walkM, L + s * WALK, 0.09, (a + b) / 2, false, true));
  })));
  LINES.forEach(Lx => LINES.forEach(Lz => [-1, 1].forEach(sx => [-1, 1].forEach(sz => {
    world.add(mesh(rlo(2, 0.18, 2, 0.06), walkM, Lx + sx * WALK, 0.09, Lz + sz * WALK, false, true));
  }))));
  // centre dashes
  LINES.forEach(L => {
    for (let p = -EXT + 2; p < EXT - 1; p += 4) {
      if (LINES.some(c => Math.abs(p - c) < 6.5)) continue;
      world.add(mesh(box(1.8, 0.02, 0.22), dashM, p, 0.07, L, false, true));
      world.add(mesh(box(0.22, 0.02, 1.8), dashM, L, 0.075, p, false, true));
    }
  });
  // crosswalks where people cross
  LINES.forEach(Lx => LINES.forEach(Lz => [-1, 1].forEach(s => {
    for (let k = -2; k <= 2; k++) {
      world.add(mesh(box(1.5, 0.02, 0.62), whiteM, Lx + s * WALK, 0.08, Lz + k * 1.3, false, true));
      world.add(mesh(box(0.62, 0.02, 1.5), whiteM, Lx + k * 1.3, 0.08, Lz + s * WALK, false, true));
    }
  })));
  // street lamps
  const poleM = mat('#3C4670', { roughness: 0.5 }), lampM = mat('#FFF3C4', { emissive: '#FFE7A0', emissiveIntensity: 0.6 });
  LINES.forEach(L => [-EXT + 8, -24, -16, 16, 24, EXT - 8].forEach(p => {
    [[p, L + 5.9], [L - 5.9, p]].forEach(([x, z]) => {
      world.add(mesh(cyl(0.11, 0.14, 4.4, 10), poleM, x, 2.2, z));
      world.add(mesh(sph(0.36, 14, 10), lampM, x, 4.55, z, false, false));
      world.add(mesh(cyl(0.4, 0.3, 0.14, 12), poleM, x, 4.9, z));
      addObs(x, z, 0.25, 0.25);
    });
  }));
  // distant hills
  const hr = seeded(3);
  const hillM = [mat('#79C964', { roughness: 1 }), mat('#6BBE5A', { roughness: 1 }), mat('#8ED474', { roughness: 1 })];
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * TAU + hr() * 0.2, d = 130 + hr() * 40, r = 24 + hr() * 22;
    const h = new THREE.Mesh(sph(1, 24, 14), hillM[i % 3]); h.scale.set(r * 1.4, r * 0.55, r);
    h.position.set(Math.cos(a) * d, -r * 0.12, Math.sin(a) * d); h.rotation.y = a; h.receiveShadow = false;
    scene.add(h);
  }
}

function house(x, z, ry, o) {

function syncCar(c) {
  const sh = Math.abs(Math.sin(c.heading)), ch = Math.abs(Math.cos(c.heading));
  c.obs.x = c.x; c.obs.z = c.z; c.obs.hw = sh * 2.15 + ch * 1.15; c.obs.hd = ch * 2.15 + sh * 1.15;
  c.g.position.set(c.x, 0, c.z); c.g.rotation.y = c.heading;
}

/* ---------- city layout ---------- */
const HOUSE_STYLES = [
  { wall: '#FFD6E2', roof: '#E05A7A', door: '#FFD23F' }, { wall: '#FFF0B3', roof: '#F08A3C', door: '#4FB6F5' },
  { wall: '#CFF3E4', roof: '#2FA58A', door: '#FF6FAE' }, { wall: '#D8E6FF', roof: '#4F79D9', door: '#FF9B4A' },
  { wall: '#ECDFFF', roof: '#8A63D2', door: '#3DD6A8' }, { wall: '#FFE2C8', roof: '#C9533B', door: '#5B6CF0' },
  { wall: '#FFFFFF', roof: '#3E8FD6', door: '#FF4F5E' }, { wall: '#E4F6C8', roof: '#6BAA3A', door: '#A77BF3' }
];
function buildCity() {
  buildGround();
  boutique(20, -17);
  shelter(15, 17);
  iceCreamShop(-26, 15);
  park(-20, -20);
  // "Mi Casa" next to the ice cream shop, facing Calle Arcoíris
  const mine = house(-13, 26, Math.PI / 2, { w: 9, d: 7.5, h: 6, wall: '#FFD6E2', roof: '#FF6FAE', door: '#9B6BF0', path: 3.3 });
  const s = makeSign('Mi Casa', '#9B6BF0', '#FFFFFF', 3.4); s.position.set(0, 5.1, 7.5 / 2 + 0.07); mine.add(s);
  flowers(-7.5, 20, 2, 4, 14, 41); flowers(-7.5, 32, 2, 4, 14, 42);

  // houses in the outer blocks, each facing the nearest street
  const outer = [-57.75, -20, 20, 57.75];
  let k = 0;
  outer.forEach(bx => outer.forEach(bz => {
    if (Math.abs(bx) < 30 && Math.abs(bz) < 30) return;
    let best = null;
    LINES.forEach(L => {
      const dx = Math.abs(bx - L), dz = Math.abs(bz - L);
      if (!best || dx < best.d) best = { d: dx, axis: 'x', dir: Math.sign(L - bx) };
      if (dz < best.d) best = { d: dz, axis: 'z', dir: Math.sign(L - bz) };
    });
    const ry = best.axis === 'x' ? (best.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (best.dir > 0 ? 0 : Math.PI);
    const st = HOUSE_STYLES[k % HOUSE_STYLES.length];
    const big = k % 3 === 1;
    const d = 7.5, towardStreet = best.d - 5.5; // distance from block center to sidewalk
    const back = towardStreet - d / 2 - 6;       // front yard of 6
    const hx = best.axis === 'x' ? bx + best.dir * back : bx;
    const hz = best.axis === 'z' ? bz + best.dir * back : bz;
    house(hx, hz, ry, Object.assign({ w: big ? 10 : 8.5, d, h: big ? 6.2 : 4.4, path: 5.2 }, st));
    // side trees & yard hedges
    const sideX = best.axis === 'x' ? 0 : 1, sideZ = 1 - sideX;
    [-1, 1].forEach(s => tree(hx + sideX * s * 8.5 + (best.axis === 'x' ? -best.dir * 3 : 0), hz + sideZ * s * 8.5 + (best.axis === 'z' ? -best.dir * 3 : 0), 0.95 + (k % 3) * 0.1, (k + (s > 0 ? 1 : 0)) % 4 === 0 ? 2 : 0));
    k++;
  }));

  // trees scattered in the outer blocks and a green belt around the city
  const r = seeded(99);
  const clearOf = (x, z, m) => !obstacles.some(o => Math.abs(x - o.x) < o.hw + m && Math.abs(z - o.z) < o.hd + m) && !LINES.some(L => Math.abs(x - L) < 7 || Math.abs(z - L) < 7);
  let placed = 0, tries = 0;
  while (placed < 26 && tries < 800) {
    tries++;
    const x = r() * 140 - 70, z = r() * 140 - 70;
    if (Math.abs(x) < 36 && Math.abs(z) < 36) continue;
    if (clearOf(x, z, 3)) { tree(x, z, 0.85 + r() * 0.4, r() < 0.3 ? 2 : (r() < 0.25 ? 1 : 0)); placed++; }
  }
  for (let i = 0; i < 70; i++) {
    const a = r() * TAU, d = 82 + r() * 26;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (LINES.some(L => Math.abs(x - L) < 5 || Math.abs(z - L) < 5)) continue;
    tree(x, z, 1 + r() * 0.6, r() < 0.45 ? 2 : 0);
  }
  // trees along inner blocks
  [[8, -32], [32, -32], [8, 32], [32, 32], [-32, 32], [-8, 8.5], [32, 8.5]].forEach(([x, z], i) => tree(x, z, 0.9, i % 2));
  // parked cars
  car(2.1, 22, 0, '#FF6FAE'); car(-2.1, -24, Math.PI, '#4FB6F5'); car(28, -2.1, Math.PI / 2, '#FFD23F');
  car(-52, 2.1, -Math.PI / 2, '#3DD6A8'); car(20, 42.1, Math.PI / 2, '#A77BF3'); car(42.1, -22, 0, '#FF7A59');

  mergeStatic(world);
}

  print: [{ id: 'ninguno', name: 'Liso' }, { id: 'corazon', name: 'Corazón', ic: '❤️' }, { id: 'estrella', name: 'Estrella', ic: '⭐' }, { id: 'rayas', name: 'Rayas' }, { id: 'lunares', name: 'Lunares' }],
  bottom: [{ id: 'pantalon', name: 'Pantalón', ic: '👖' }, { id: 'shorts', name: 'Shorts', ic: '🩳' }, { id: 'falda', name: 'Falda' }, { id: 'tutu', name: 'Tutú' }],
  shoes: [{ id: 'zapatillas', name: 'Zapatillas', ic: '👟' }, { id: 'botas', name: 'Botas', ic: '🥾' }, { id: 'patines', name: 'Patines', ic: '🛼' }],
  head: [{ id: 'ninguno', name: 'Nada' }, { id: 'jockey', name: 'Jockey', ic: '🧢' }, { id: 'sombrero', name: 'Sombrero', ic: '👒' }, { id: 'corona', name: 'Corona', ic: '👑' }, { id: 'orejas', name: 'Orejitas', ic: '🐱' }, { id: 'lazo', name: 'Lazo', ic: '🎀' }, { id: 'lentes', name: 'Lentes', ic: '🕶️' }, { id: 'flores', name: 'Flores', ic: '🌸' }],
  back: [{ id: 'ninguno', name: 'Nada' }, { id: 'mochila', name: 'Mochila', ic: '🎒' }, { id: 'alas', name: 'Alas de hada', ic: '🧚' }, { id: 'capa', name: 'Capa', ic: '🦸' }]
};
const DEFAULT_OUTFIT = {
  skin: 1, hair: { style: 'cola', color: '#5A3521' },
  top: { style: 'polera', color: '#FF6FAE', print: 'corazon' }, bottom: { style: 'falda', color: '#4FB6F5' },
  shoes: { style: 'zapatillas', color: '#FFFFFF' }, head: { style: 'ninguno', color: '#FFD23F' }, back: { style: 'ninguno', color: '#A77BF3' }
};
function tint(hex, k) { const c = new THREE.Color(hex); c.lerp(new THREE.Color(0xFFFFFF), k); return '#' + c.getHexString(); }
function randomOutfit(skin) {
  return {
    skin: skin ?? Math.floor(Math.random() * SKIN.length),
    hair: { style: pick(STYLES.hair).id, color: pick(HAIR_COLORS) },
    top: { style: pick(STYLES.top).id, color: pick(CLOTH_COLORS), print: pick(STYLES.print).id },
    bottom: { style: pick(STYLES.bottom).id, color: pick(CLOTH_COLORS) },
    shoes: { style: Math.random() < 0.18 ? 'patines' : pick(['zapatillas', 'zapatillas', 'botas']), color: pick(SHOE_COLORS) },
    head: { style: Math.random() < 0.4 ? 'ninguno' : pick(STYLES.head).id, color: pick(ACC_COLORS) },
    back: { style: Math.random() < 0.55 ? 'ninguno' : pick(STYLES.back).id, color: pick(ACC_COLORS) },
    face: randomFace(),
    costume: { style: Math.random() < 0.16 ? pick(COSTUME_LIST.slice(1)).id : 'ninguno', color: '' },
    prop: { style: Math.random() < 0.22 ? pick(PROP_LIST.slice(1)).id : 'ninguno' },
    paint: { style: Math.random() < 0.15 ? pick(STYLES.paint.slice(1)).id : 'ninguno' }
  };
}

const heartGeo = () => G('heart', () => {
  const s = new THREE.Shape();
  s.moveTo(0, -0.1); s.bezierCurveTo(-0.02, -0.08, -0.13, -0.02, -0.12, 0.04); s.bezierCurveTo(-0.11, 0.1, -0.03, 0.11, 0, 0.05);
  s.bezierCurveTo(0.03, 0.11, 0.11, 0.1, 0.12, 0.04); s.bezierCurveTo(0.13, -0.02, 0.02, -0.08, 0, -0.1);
  return new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false, curveSegments: 10 });
});
const starGeo = () => G('star', () => {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) { const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.055 : 0.13; const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); }
  s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 0.03, bevelEnabled: false });
});

const tieGeo = () => G('tie', () => new THREE.TorusGeometry(0.09, 0.035, 8, 16));
function addHair(head, style, hairM, accM) {
  if (style === 'none') return;
  const cap = mesh(G('hcap', () => new THREE.SphereGeometry(0.5, 28, 16, 0, TAU, 0, Math.PI * 0.55)), hairM);
  cap.rotation.x = -0.6; cap.scale.set(1, 0.97, 0.98); head.add(cap);
  [[-0.19, 0.36, 0.9], [0, 0.4, 1.05], [0.19, 0.36, 0.9]].forEach(([x, z, k]) => { const b = mesh(sph(0.16, 12, 8), hairM, x, 0.235, z); b.scale.set(k, 0.55, 0.55); head.add(b); });
  if (style === 'cola') {
    head.add(mesh(sph(0.15, 12, 10), hairM, 0, 0.28, -0.44));
    head.add(mesh(tieGeo(), accM, 0, 0.2, -0.53));
    [[0.08, -0.58, 0.16], [-0.14, -0.62, 0.14], [-0.34, -0.58, 0.11]].forEach(([y, z, r]) => head.add(mesh(sph(r, 12, 10), hairM, 0, y, z)));
  } else if (style === 'largo') {
    head.add(mesh(rbox(0.88, 0.95, 0.2, 0.1), hairM, 0, -0.28, -0.36));
    [-1, 1].forEach(s => head.add(mesh(rbox(0.16, 0.72, 0.26, 0.08), hairM, s * 0.43, -0.2, 0.0)));
  } else if (style === 'monos') {
    [-1, 1].forEach(s => { head.add(mesh(sph(0.2, 14, 10), hairM, s * 0.3, 0.38, -0.12)); head.add(mesh(tieGeo(), accM, s * 0.25, 0.3, -0.1)); });
  } else if (style === 'trenzas') {
    [-1, 1].forEach(s => {
      for (let i = 0; i < 4; i++) head.add(mesh(sph(0.12 - i * 0.012, 10, 8), hairM, s * 0.41, -0.08 - i * 0.16, -0.1));
      head.add(mesh(sph(0.06, 8, 6), accM, s * 0.41, -0.66, -0.1));
    });
  } else if (style === 'rizado') {
    const r = seeded(5);
    for (let i = 0; i < 44; i++) {
      const u = r() * 2 - 1, a = r() * TAU, s = Math.sqrt(1 - u * u);
      const x = s * Math.cos(a) * 0.49, y = u * 0.49, z = s * Math.sin(a) * 0.49;
      if (y < -0.28 || (z > 0.2 && y < 0.3)) continue;
      head.add(mesh(sph(0.15, 10, 8), hairM, x, y + 0.03, z - 0.02));
    }
  }
}

function addHeadAcc(head, st, color) {
  if (st === 'lentesestrella') return addStarGlasses(head, color);
  const m = mat(color, { roughness: 0.55 }), white = mat('#FFFFFF');
  if (st === 'jockey') {
    const crown = mesh(G('jcrown', () => new THREE.SphereGeometry(0.53, 24, 12, 0, TAU, 0, Math.PI * 0.45)), m); crown.rotation.x = -0.3; head.add(crown);
    const vis = mesh(cyl(0.3, 0.3, 0.035, 24), m, 0, 0.3, 0.48); vis.scale.set(1, 1, 1.1); vis.rotation.x = 0.12; head.add(vis);
    head.add(mesh(sph(0.05, 8, 6), white, 0, 0.53, -0.1));
  } else if (st === 'sombrero') {
    const brim = mesh(cyl(0.82, 0.82, 0.05, 32), m, 0, 0.3, 0); brim.rotation.x = -0.1; head.add(brim);
    head.add(mesh(cyl(0.42, 0.47, 0.36, 24), m, 0, 0.48, -0.02));
    head.add(mesh(cyl(0.475, 0.475, 0.1, 24), mat(color === '#FF6FAE' ? '#FFFFFF' : '#FF6FAE'), 0, 0.37, -0.02));
  } else if (st === 'corona') {
    const g = mat(color, { roughness: 0.25, metalness: 0.45 });
    head.add(mesh(cyl(0.29, 0.31, 0.14, 20), g, 0, 0.5, 0));
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; head.add(mesh(cone(0.07, 0.17, 10), g, Math.sin(a) * 0.27, 0.64, Math.cos(a) * 0.27)); }
    head.add(mesh(sph(0.055, 10, 8), mat('#FF4F9A', { roughness: 0.2 }), 0, 0.5, 0.31));
  } else if (st === 'orejas') {
    [-1, 1].forEach(s => {
      const e = mesh(cone(0.14, 0.3, 12), m, s * 0.27, 0.5, -0.02); e.rotation.z = -s * 0.4; head.add(e);
      const i = mesh(cone(0.08, 0.18, 10), mat('#FFB3CC'), s * 0.265, 0.47, 0.06); i.rotation.z = -s * 0.4; head.add(i);
    });
  } else if (st === 'lazo') {
    const c = [0.2, 0.44, 0.14];
    head.add(mesh(sph(0.07, 10, 8), m, c[0], c[1], c[2]));
    [-1, 1].forEach(s => { const l = mesh(cone(0.13, 0.24, 12), m, c[0] + s * 0.13, c[1], c[2]); l.rotation.z = s * Math.PI / 2; head.add(l); });
  } else if (st === 'lentes') {
    [-1, 1].forEach(s => {
      head.add(mesh(G('lensring', () => new THREE.TorusGeometry(0.105, 0.022, 8, 20)), m, s * 0.16, 0.02, 0.445));
      const l = mesh(cyl(0.1, 0.1, 0.02, 20), mat('#2E3350', { roughness: 0.15 }), s * 0.16, 0.02, 0.435); l.rotation.x = Math.PI / 2; head.add(l);
      head.add(mesh(box(0.025, 0.025, 0.34), m, s * 0.27, 0.03, 0.27));
    });
    const br = mesh(cyl(0.015, 0.015, 0.12, 6), m, 0, 0.04, 0.45); br.rotation.z = Math.PI / 2; head.add(br);
  } else if (st === 'flores') {
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU, x = Math.sin(a) * 0.43, z = Math.cos(a) * 0.43;
      head.add(mesh(sph(0.078, 10, 8), i % 2 ? white : m, x, 0.3, z));
      head.add(mesh(sph(0.035, 8, 6), mat('#FFD23F'), x * 1.1, 0.31, z * 1.1));
    }
  }
}

function buildRig(o, holding) {
  o = costumeOutfit(o);
  const R = { disposables: [], skates: o.shoes.style === 'patines' };
  const skinM = mat(SKIN[o.skin] ?? SKIN[1], { roughness: 0.6 });
  const topC = o.top.color, botC = o.bottom.color;
  const topM = mat(topC, { roughness: 0.85 }), botM = mat(botC, { roughness: 0.85 });
  const dress = o.top.style === 'vestido';
  const skirt = dress || o.bottom.style === 'falda' || o.bottom.style === 'tutu';
  const lift = R.skates ? 0.17 : 0;
  const body = new THREE.Group(); R.body = body; R.lift = lift;
  const ty = 0.8 + lift;

  // legs
  const thighM = skirt ? skinM : botM;
  const shinM = (!skirt && o.bottom.style === 'pantalon') ? botM : skinM;
  const shoeM = mat(o.shoes.color, { roughness: 0.5 });
  [-1, 1].forEach(s => {
    const leg = new THREE.Group(); leg.position.set(s * 0.19, ty, 0);
    leg.add(mesh(rbox(0.3, 0.44, 0.32, 0.1), thighM, 0, -0.2, 0));
    leg.add(mesh(rbox(0.27, 0.4, 0.29, 0.1), shinM, 0, -0.52, 0));
    if (o.shoes.style === 'botas') leg.add(mesh(rbox(0.31, 0.36, 0.33, 0.1), shoeM, 0, -0.53, 0));
    leg.add(mesh(rbox(0.32, 0.17, 0.44, 0.08), shoeM, 0, -0.715, 0.06));
    leg.add(mesh(rbox(0.33, 0.06, 0.46, 0.03), mat('#FFFFFF', { roughness: 0.6 }), 0, -0.79, 0.06));
    if (R.skates) {
      leg.add(mesh(rbox(0.22, 0.05, 0.5, 0.02), mat('#C9C3D6'), 0, -0.84, 0.06));
      [0.24, -0.12].forEach(z => { const w = mesh(cyl(0.075, 0.075, 0.28, 14), mat('#FFD23F', { roughness: 0.4 }), 0, -0.9, z); w.rotation.z = Math.PI / 2; leg.add(w); });
    }
    body.add(leg); R[s < 0 ? 'legL' : 'legR'] = leg;
  });

  // torso
  if (o.top.style === 'chaleco') addVest(body, R, ty, topM);
  else body.add(mesh(rbox(0.74, 0.72, 0.42, 0.16), topM, 0, ty + 0.36, 0));
  if (!skirt) body.add(mesh(rbox(0.72, 0.2, 0.4, 0.08), botM, 0, ty + 0.03, 0));
  if (dress) body.add(mesh(cyl(0.36, 0.68, 0.54, 26), topM, 0, ty - 0.14, 0));
  else if (o.bottom.style === 'falda') body.add(mesh(cyl(0.38, 0.6, 0.42, 26), botM, 0, ty - 0.06, 0));
  else if (o.bottom.style === 'tutu') [0, 1, 2].forEach(i => body.add(mesh(cyl(0.38 + i * 0.03, 0.64 + i * 0.07, 0.13, 26), mat(i % 2 ? tint(botC, 0.35) : botC, { roughness: 0.9 }), 0, ty + 0.03 - i * 0.1, 0)));
  if (o.top.style === 'poleron') {
    body.add(mesh(rbox(0.56, 0.28, 0.2, 0.1), topM, 0, ty + 0.68, -0.24));
    body.add(mesh(rbox(0.46, 0.18, 0.05, 0.04), mat(shade(topC, 0.86), { roughness: 0.85 }), 0, ty + 0.16, 0.21));
    [-1, 1].forEach(s => body.add(mesh(cyl(0.016, 0.016, 0.2, 5), mat('#FFFFFF'), s * 0.08, ty + 0.56, 0.225)));
  }
  const printM = mat(topC.toUpperCase() === '#FFFFFF' ? '#FF6FAE' : '#FFFFFF', { roughness: 0.7 });
  const pr = o.top.style === 'chaleco' ? 'ninguno' : o.top.print;
  if (pr === 'corazon') body.add(mesh(heartGeo(), printM, 0, ty + 0.44, 0.2));
  else if (pr === 'estrella') body.add(mesh(starGeo(), printM, 0, ty + 0.44, 0.2));
  else if (pr === 'rayas') [0.16, 0.36, 0.56].forEach(dy => body.add(mesh(rbox(0.755, 0.07, 0.435, 0.03), printM, 0, ty + dy, 0)));
  else if (pr === 'lunares') [[-0.2, 0.2], [0.04, 0.3], [0.22, 0.14], [-0.1, 0.5], [0.2, 0.52], [-0.24, 0.62], [0.02, 0.62]].forEach(([x, y]) => { const d = mesh(sph(0.05, 10, 8), printM, x, ty + y, 0.205); d.scale.z = 0.4; body.add(d); });
  body.add(mesh(cyl(0.12, 0.13, 0.16, 12), skinM, 0, ty + 0.78, 0));

  // arms
  const longS = o.top.style === 'poleron', shortS = o.top.style === 'polera' || o.top.style === 'chaleco';
  [-1, 1].forEach(s => {
    const arm = new THREE.Group(); arm.position.set(s * 0.48, ty + 0.64, 0);
    arm.add(mesh(rbox(0.22, 0.36, 0.24, 0.1), (longS || shortS) ? topM : skinM, 0, -0.17, 0));
    if (dress) { const p = mesh(sph(0.17, 14, 10), topM, 0, -0.06, 0); p.scale.set(1, 0.8, 1); arm.add(p); }
    arm.add(mesh(rbox(0.2, 0.3, 0.22, 0.09), longS ? topM : skinM, 0, -0.46, 0));
    arm.add(mesh(sph(0.12, 14, 10), skinM, 0, -0.66, 0));
    body.add(arm); R[s < 0 ? 'armL' : 'armR'] = arm;
  });
  if (holding) {
    const ice = new THREE.Group(); ice.position.set(0, -0.68, 0.02); ice.rotation.x = 1.0;
    const c = mesh(cone(0.1, 0.32, 14), mat('#E7A45C', { roughness: 0.8 }), 0, 0.02, 0); c.rotation.x = Math.PI; ice.add(c);
    ice.add(mesh(sph(0.14, 14, 10), mat(holding, { roughness: 0.5 }), 0, 0.22, 0));
    ice.add(mesh(sph(0.045, 8, 6), mat('#FF3B5C', { roughness: 0.3 }), 0, 0.37, 0));
    R.armR.add(ice);
  }

  // head
  const head = new THREE.Group(); head.position.set(0, ty + 1.15, 0); body.add(head); R.head = head;
  const hs = mesh(sph(0.46, 28, 20), skinM); hs.scale.set(1, 0.95, 0.95); head.add(hs);
  [-1, 1].forEach(s => {
    const b = mesh(sph(0.075, 12, 8), mat('#FF9DB5', { roughness: 0.9 }), s * 0.29, -0.11, 0.33, false); b.scale.set(1, 0.55, 0.35); head.add(b);
    const ear = mesh(sph(0.09, 10, 8), skinM, s * 0.45, -0.02, 0); (R.ears = R.ears || []).push(ear); head.add(ear);
  });
  const face = o.face || DEFAULT_OUTFIT.face;
  addEyes(head, face);
  addMouth(head, face);
  addPaint(head, o.paint);
  const hairM = mat(o.hair.color, { roughness: 0.5, side: THREE.DoubleSide });
  const accM = mat(o.head.color || '#FF6FAE', { roughness: 0.5 });
  addHair(head, o.hair.style, hairM, mat(o.hair.style === 'cola' || o.hair.style === 'monos' || o.hair.style === 'trenzas' ? (o.head.color || '#FF6FAE') : '#FF6FAE'));
  addHeadAcc(head, o.head.style, o.head.color);

  // back items
  const bc = o.back.color;
  if (o.back.style === 'mochila') {
    const bm = mat(bc, { roughness: 0.7 }), bd = mat(shade(bc, 0.82), { roughness: 0.7 });
    body.add(mesh(rbox(0.56, 0.6, 0.26, 0.12), bm, 0, ty + 0.4, -0.34));
    body.add(mesh(rbox(0.4, 0.22, 0.08, 0.04), bd, 0, ty + 0.25, -0.48));
    [-1, 1].forEach(s => body.add(mesh(rbox(0.08, 0.62, 0.04, 0.02), bd, s * 0.2, ty + 0.4, 0.215)));
  } else if (o.back.style === 'alas') {
    const wm = new THREE.MeshStandardMaterial({ color: tint(bc, 0.35), emissive: bc, emissiveIntensity: 0.25, roughness: 0.3, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    R.wings = [-1, 1].map(s => {
      const w = new THREE.Group(); w.position.set(0, ty + 0.5, -0.24); w.userData.s = s;
      const a = mesh(sph(0.38, 16, 10), wm, s * 0.38, 0.16, 0, false); a.scale.set(1, 0.62, 0.07); a.rotation.z = s * 0.5; w.add(a);
      const b = mesh(sph(0.27, 14, 10), wm, s * 0.3, -0.2, 0, false); b.scale.set(1, 0.6, 0.07); b.rotation.z = -s * 0.4; w.add(b);
      body.add(w); return w;
    });
  } else if (o.back.style === 'capa') {
    const cp = new THREE.Group(); cp.position.set(0, ty + 0.72, -0.23);
    cp.add(mesh(rbox(0.8, 1.15, 0.04, 0.02), mat(bc, { roughness: 0.7, side: THREE.DoubleSide }), 0, -0.57, 0));
    cp.add(mesh(rbox(0.5, 0.12, 0.3, 0.05), mat(shade(bc, 0.85)), 0, 0.02, 0.1));
    body.add(cp); R.cape = cp;
  }

  // costume pieces and hand-held props
  const ctx = { body, head, R, ty, hs };
  if (o._cost) o._cost.extra(ctx, o._costColor);
  addProp(ctx, o.prop, holding);

  // merge each moving part into a handful of draw calls
  [body, head, R.armL, R.armR, R.legL, R.legR, R.cape].forEach(g => { if (g) mergeChildren(g).forEach(m => R.disposables.push(m.geometry)); });
  return R;
}

function makeCharacter(outfit) {
  const c = { root: new THREE.Group(), outfit: null, rig: null, holding: null };
  scene.add(c.root);
  dressCharacter(c, outfit);
  return c;
}
function dressCharacter(c, o) {
  if (c.rig) { c.root.remove(c.rig.body); c.rig.disposables.forEach(g => g.dispose()); }
  c.outfit = JSON.parse(JSON.stringify(o));
  c.rig = buildRig(c.outfit, c.holding);
  c.root.add(c.rig.body);
}
function animateRig(R, st) {
  const s = st.speed01, sw = Math.sin(st.phase);
  const legAmp = R.skates ? 0.3 : 0.75;
  R.legL.rotation.x = sw * legAmp * s; R.legR.rotation.x = -sw * legAmp * s;
  R.armL.rotation.set(-sw * 0.7 * s, 0, -0.08);
  R.armR.rotation.set(sw * 0.7 * s, 0, 0.08);
  const idle = Math.sin(st.t * 2.2);
  R.body.position.y = R.lift + Math.abs(Math.cos(st.phase)) * (R.skates ? 0.02 : 0.07) * s + (1 - s) * idle * 0.012;
  R.body.rotation.z = R.skates ? sw * 0.06 * s : 0;
  R.head.rotation.set(idle * 0.03, st.look || 0, 0);
  if (st.air) { R.legL.rotation.x = 0.5; R.legR.rotation.x = -0.35; R.armL.rotation.z = -1.1; R.armR.rotation.z = 1.1; }
  if (st.happy > 0) { const k = Math.sin(st.happy / 0.6 * Math.PI); R.body.position.y += k * 0.3; R.armL.rotation.z = -0.08 - k * 2.2; R.armR.rotation.z = 0.08 + k * 2.2; }
  if ((st.hold || R.holdPose) && !(st.wave > 0)) { R.armR.rotation.x = -1.0; R.armR.rotation.z = 0.12; }
  if (st.wave > 0) { R.armR.rotation.set(0, 0, 2.7 + Math.sin(st.t * 14) * 0.35); }
  if (R.wings) R.wings.forEach(w => { w.rotation.y = w.userData.s * (0.35 + Math.sin(st.t * (6 + s * 10)) * 0.28); });
  if (R.spin) R.spin.forEach(b => { b.rotation.y = st.t * 1.6; });
  if (R.cape) R.cape.rotation.x = 0.1 + s * 0.6 + Math.sin(st.t * 7) * 0.05 * (0.4 + s) + (st.air ? 0.4 : 0);
}

function buildPet(kind, color) {
  const P = { kind, color, root: new THREE.Group(), body: new THREE.Group(), legs: [], tail: null, head: null, phase: 0, disposables: [] };
  P.root.add(P.body);
  const c = mat(color, { roughness: 0.8 }), dk = mat(shade(color, 0.72), { roughness: 0.8 }), lt = mat(tint(color, 0.5), { roughness: 0.8 });
  const eye = mat('#1F1B2E', { roughness: 0.25 }), pink = mat('#FF9DB5', { roughness: 0.7 }), B = P.body;
  const head = new THREE.Group(); P.head = head;
  const leg = (x, y, z, w, h) => { const l = new THREE.Group(); l.position.set(x, y, z); l.add(mesh(rbox(w, h, w + 0.01, w * 0.4), c, 0, -h / 2, 0)); B.add(l); P.legs.push(l); };
  const eyes = (x, y, z, r = 0.045) => [-1, 1].forEach(s => { head.add(mesh(sph(r, 10, 8), eye, s * x, y, z)); head.add(mesh(sph(r * 0.35, 6, 5), mat('#FFFFFF', { emissive: '#FFFFFF', emissiveIntensity: 0.6 }), s * x + r * 0.35, y + r * 0.4, z + r * 0.8, false)); });
  if (kind === 'perro') {
    B.add(mesh(rbox(0.44, 0.38, 0.66, 0.16), c, 0, 0.46, 0));
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => leg(a * 0.14, 0.34, b * 0.21, 0.13, 0.32));
    head.position.set(0, 0.74, 0.34);
    head.add(mesh(sph(0.27, 18, 14), c));
    head.add(mesh(rbox(0.22, 0.15, 0.2, 0.07), lt, 0, -0.06, 0.24));
    head.add(mesh(sph(0.055, 10, 8), eye, 0, -0.0, 0.34));
    head.add(mesh(rbox(0.08, 0.03, 0.1, 0.015), pink, 0, -0.14, 0.3));
    eyes(0.1, 0.06, 0.23);
    [-1, 1].forEach(s => { const e = mesh(rbox(0.11, 0.26, 0.16, 0.05), dk, s * 0.24, -0.02, 0); e.rotation.z = s * 0.25; head.add(e); });
    const t = new THREE.Group(); t.position.set(0, 0.58, -0.32); t.rotation.x = -0.6; t.add(mesh(cyl(0.05, 0.035, 0.32, 8), c, 0, 0.16, 0)); B.add(t); P.tail = t;
  } else if (kind === 'gato') {
    B.add(mesh(rbox(0.36, 0.34, 0.6, 0.15), c, 0, 0.42, 0));
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => leg(a * 0.11, 0.3, b * 0.19, 0.11, 0.3));
    head.position.set(0, 0.7, 0.3);
    head.add(mesh(sph(0.25, 18, 14), c));
    [-1, 1].forEach(s => { const e = mesh(cone(0.1, 0.2, 12), c, s * 0.14, 0.22, 0); e.rotation.z = -s * 0.25; head.add(e); const i = mesh(cone(0.055, 0.12, 10), pink, s * 0.14, 0.2, 0.05); i.rotation.z = -s * 0.25; head.add(i); });
    head.add(mesh(sph(0.035, 8, 6), pink, 0, -0.03, 0.245));
    head.add(mesh(rbox(0.16, 0.09, 0.06, 0.03), lt, 0, -0.08, 0.22));
    eyes(0.1, 0.05, 0.21, 0.05);
    const t = new THREE.Group(); t.position.set(0, 0.5, -0.3); t.rotation.x = -0.35;
    t.add(mesh(cyl(0.045, 0.04, 0.55, 8), c, 0, 0.27, 0)); t.add(mesh(sph(0.055, 8, 6), dk, 0, 0.56, 0)); B.add(t); P.tail = t;
  } else if (kind === 'conejo') {
    const b = mesh(sph(0.3, 18, 14), c, 0, 0.34, 0); b.scale.set(1, 0.9, 1.1); B.add(b);
    [[-1, 1], [1, 1]].forEach(([a]) => leg(a * 0.1, 0.16, 0.18, 0.1, 0.14));
    [-1, 1].forEach(s => { const f = new THREE.Group(); f.position.set(s * 0.15, 0.12, -0.1); f.add(mesh(rbox(0.13, 0.1, 0.26, 0.05), c, 0, -0.07, 0.02)); B.add(f); P.legs.push(f); });
    head.position.set(0, 0.64, 0.2);
    head.add(mesh(sph(0.22, 18, 14), c));
    [-1, 1].forEach(s => { const e = mesh(rbox(0.1, 0.42, 0.07, 0.045), c, s * 0.08, 0.32, -0.02); e.rotation.z = s * 0.15; head.add(e); const i = mesh(rbox(0.05, 0.3, 0.02, 0.02), pink, s * 0.085, 0.31, 0.02); i.rotation.z = s * 0.15; head.add(i); });
    head.add(mesh(sph(0.04, 8, 6), pink, 0, -0.02, 0.215));
    eyes(0.09, 0.05, 0.18);
    const t = new THREE.Group(); t.position.set(0, 0.38, -0.33); t.add(mesh(sph(0.1, 10, 8), mat('#FFFFFF'), 0, 0, 0)); B.add(t); P.tail = t;
  } else { // unicornio
    B.add(mesh(rbox(0.42, 0.42, 0.74, 0.17), c, 0, 0.68, 0));
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => { leg(a * 0.14, 0.52, b * 0.25, 0.13, 0.5); P.legs[P.legs.length - 1].add(mesh(rbox(0.14, 0.08, 0.15, 0.03), mat('#C9A0E8'), 0, -0.47, 0)); });
    const neck = mesh(rbox(0.22, 0.42, 0.22, 0.09), c, 0, 0.97, 0.3); neck.rotation.x = 0.45; B.add(neck);
    head.position.set(0, 1.18, 0.44);
    head.add(mesh(rbox(0.26, 0.26, 0.42, 0.11), c, 0, 0, 0.08));
    head.add(mesh(rbox(0.22, 0.16, 0.16, 0.07), mat('#FFC6DA'), 0, -0.05, 0.26));
    eyes(0.13, 0.05, 0.12);
    const horn = mesh(cone(0.05, 0.3, 12), mat('#FFD23F', { roughness: 0.3, metalness: 0.3 }), 0, 0.26, 0.08); horn.rotation.x = 0.35; head.add(horn);
    [-1, 1].forEach(s => head.add(mesh(cone(0.05, 0.12, 8), c, s * 0.09, 0.17, -0.07)));
    RAINBOW.forEach((col, i) => B.add(mesh(sph(0.085, 10, 8), mat(col), 0, 1.26 - i * 0.09, 0.3 - i * 0.07)));
    const t = new THREE.Group(); t.position.set(0, 0.82, -0.38); t.rotation.x = -0.9;
    RAINBOW.forEach((col, i) => t.add(mesh(sph(0.09 - i * 0.004, 10, 8), mat(col), 0, i * 0.1, -i * 0.02)));
    B.add(t); P.tail = t;
  }
  B.add(head);
  [B, head, P.tail, ...P.legs].forEach(g => mergeChildren(g).forEach(m => P.disposables.push(m.geometry)));
  P.labelY = kind === 'unicornio' ? 1.75 : 1.2;
  return P;
}
function setPetName(P, name) {
  if (P.label) P.root.remove(P.label);
  P.label = labelSprite(name, { scale: 0.0042 }); P.label.position.y = P.labelY; P.root.add(P.label);
}
function disposePet(P) { scene.remove(P.root); P.disposables.forEach(g => g.dispose()); }
function animatePet(P, t, speed01, dt) {
  const hop = speed01 > 0.05;
  P.phase += dt * (hop ? 9 + Math.min(speed01, 3) * 5 : 0);
  const k = P.kind === 'conejo' ? 1.7 : 1;
  P.body.position.y = hop ? Math.abs(Math.sin(P.phase)) * 0.13 * k : Math.abs(Math.sin(t * 2.5)) * 0.01;
  P.legs.forEach((l, i) => { l.rotation.x = hop ? Math.sin(P.phase + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * 0.6 : 0; });
  if (P.tail) P.tail.rotation.z = Math.sin(t * (hop ? 16 : 7)) * (P.kind === 'conejo' ? 0.2 : 0.45);
  if (P.head) P.head.rotation.y = hop ? 0 : Math.sin(t * 0.9 + P.phase) * 0.28;
}

// eye shapes: radius, x-scale, y-scale, outer-corner lift
const EYE_SHAPES = { redondos: [0.08, 1, 1, 0], ovalados: [0.075, 1, 1.3, 0], rasgados: [0.075, 1.4, 0.6, 0.22], grandes: [0.098, 1, 1.22, 0], pequenos: [0.05, 1, 1, 0], pestanas: [0.075, 1, 1.3, 0], guino: [0.075, 1, 1.3, 0] };
function addEyes(head, f) {
  const st = f.eyes || 'ovalados', col = f.eyeColor || '#26233A';
  const irisM = mat(col, { roughness: 0.25 }), pupilM = mat('#1A1726', { roughness: 0.25 });
  const glint = mat('#FFFFFF', { emissive: '#FFFFFF', emissiveIntensity: 0.6 }), lineM = mat(INK, { roughness: 0.4 });
  [-1, 1].forEach(s => {
    const x = s * 0.16, y = 0, z = 0.405;
    if (st === 'felices' || (st === 'guino' && s > 0)) {
      const a = mesh(G('eyearc', () => new THREE.TorusGeometry(0.062, 0.019, 8, 18, Math.PI)), lineM, x, -0.02, 0.412, false);
      a.rotation.x = -0.02; head.add(a); return;
    }
    const [r, sx, sy, tilt] = EYE_SHAPES[st] || EYE_SHAPES.ovalados;
    const e = mesh(sph(r, 16, 12), irisM, x, y, z); e.scale.set(sx, sy, 0.55); e.rotation.z = s * tilt; head.add(e);
    if (col !== '#26233A') { const p = mesh(sph(r * 0.55, 12, 8), pupilM, x, y, z + r * 0.36, false); p.scale.set(sx, sy, 0.5); p.rotation.z = s * tilt; head.add(p); }
    head.add(mesh(sph(r * 0.34, 8, 6), glint, x + r * 0.32 * sx, y + r * 0.5 * sy, z + r * 0.5, false));
    if (st === 'grandes') head.add(mesh(sph(r * 0.17, 6, 5), glint, x - r * 0.3, y - r * 0.5, z + r * 0.5, false));
    if (st === 'pestanas') for (let k = 0; k < 3; k++) {
      const l = mesh(box(0.014, 0.065, 0.014), lineM, x + s * (0.045 + k * 0.022), y + 0.105 - k * 0.018, z + 0.005, false);
      l.rotation.z = -s * (0.45 + k * 0.4); head.add(l);
    }
  });
}
function addMouth(head, f) {
  const st = f.mouth || 'sonrisa';
  const lineM = mat('#8A3B46', { roughness: 0.5 }), inM = mat(MOUTH_IN, { roughness: 0.6 });
  const teethM = mat('#FFFFFF', { roughness: 0.4 }), tongueM = mat('#FF7A93', { roughness: 0.6 });
  const g = new THREE.Group(); g.position.set(0, -0.13, 0.408); g.rotation.x = 0.28; head.add(g);
  const add = (geo, m, x = 0, y = 0, z = 0, rz = 0) => { const o = mesh(geo, m, x, y, z, false); o.rotation.z = rz; g.add(o); return o; };
  const arc = (r, t) => G(`arc${r},${t}`, () => new THREE.TorusGeometry(r, t, 8, 16, Math.PI));
  if (st === 'sonrisa') add(arc(0.075, 0.02), lineM, 0, 0.02, 0, Math.PI);
  else if (st === 'pequena') add(arc(0.04, 0.017), lineM, 0, 0.005, 0, Math.PI);
  else if (st === 'risa') {
    add(G('grin', () => { const s = new THREE.Shape(); s.moveTo(-0.09, 0.02); s.lineTo(0.09, 0.02); s.absarc(0, 0.02, 0.09, 0, -Math.PI, true); return new THREE.ExtrudeGeometry(s, { depth: 0.012, bevelEnabled: false, curveSegments: 14 }); }), inM);
    add(rbox(0.13, 0.03, 0.01, 0.005), teethM, 0, 0.002, 0.015);
    const t = add(sph(0.036, 10, 8), tongueM, 0, -0.045, 0.01); t.scale.set(1.3, 0.6, 0.3);
  } else if (st === 'sorpresa') {
    const o = add(G('ohole', () => new THREE.CircleGeometry(0.045, 20)), inM, 0, -0.01, 0.006); o.scale.set(0.8, 1.1, 1);
    const ring = add(G('oring', () => new THREE.TorusGeometry(0.045, 0.013, 8, 20)), lineM, 0, -0.01, 0.006); ring.scale.set(0.8, 1.1, 1);
  } else if (st === 'lengua') {
    add(arc(0.07, 0.019), lineM, 0, 0.02, 0, Math.PI);
    const t = add(sph(0.04, 10, 8), tongueM, 0.02, -0.055, -0.004); t.scale.set(0.9, 1.1, 0.45);
  } else if (st === 'gatito') {
    [-1, 1].forEach(s => add(arc(0.034, 0.016), lineM, s * 0.034, 0.012, 0, Math.PI));
  } else add(rbox(0.1, 0.022, 0.02, 0.009), lineM, 0, 0, 0);
}

function costumeOutfit(o) {
  const C = o.costume && COSTUME_DEFS[o.costume.style];
  if (!C) return o;
  const col = C.tint && o.costume.color ? o.costume.color : C.color;
  const r = JSON.parse(JSON.stringify(o));
  C.dress(r, col);
  r._cost = C; r._costColor = col;
  return r;
}

function addProp(ctx, prop, holding) {
  const st = prop && prop.style; if (!st || st === 'ninguno') return;
  const { R, body, ty } = ctx;
  if (st === 'guantes') { const g = mat('#FF3B4E', { roughness: 0.35 }); [R.armL, R.armR].forEach(a => a.add(mesh(rbox(0.26, 0.28, 0.3, 0.12), g, 0, -0.68, 0.03))); return; }
  if (st === 'guitarra') {
    const red = mat('#E8573F', { roughness: 0.3 }), wood = mat('#6D4A30'), blk = mat('#26233A');
    const gt = new THREE.Group(); gt.position.set(0.05, ty + 0.3, 0.34); gt.rotation.z = -0.9;
    const b1 = mesh(sph(0.22, 16, 12), red, 0, -0.12, 0); b1.scale.z = 0.35; gt.add(b1);
    const b2 = mesh(sph(0.17, 16, 12), red, 0, 0.12, 0); b2.scale.z = 0.35; gt.add(b2);
    const hole = mesh(cyl(0.06, 0.06, 0.02, 14), blk, 0, 0.0, 0.075); hole.rotation.x = Math.PI / 2; gt.add(hole);
    gt.add(mesh(rbox(0.07, 0.6, 0.04, 0.015), wood, 0, 0.5, 0.02)); gt.add(mesh(rbox(0.11, 0.14, 0.05, 0.02), blk, 0, 0.84, 0.02));
    body.add(gt);
    const strap = mesh(box(0.06, 0.95, 0.02), blk, 0, ty + 0.45, 0.225); strap.rotation.z = 0.75; body.add(strap);
    return;
  }
  if (st === 'electrica') { addElectricGuitar(body, ty); return; }
  if (holding) return; // the ice cream takes the hand
  R.holdPose = true;
  const p = new THREE.Group(); p.position.set(0, -0.68, 0.02); p.rotation.x = 1.0;
  const A = (geo, m, x, y, z) => { const o = mesh(geo, m, x, y, z); p.add(o); return o; };
  if (st === 'varita') {
    A(cyl(0.018, 0.022, 0.5, 8), mat('#3A2A5A'), 0, 0.15, 0);
    const s = A(starGeo(), mat('#FFD23F', { emissive: '#FFC21A', emissiveIntensity: 0.6, roughness: 0.3 }), 0, 0.44, -0.015); s.scale.setScalar(1.1);
  } else if (st === 'microfono') {
    A(cyl(0.045, 0.032, 0.3, 12), mat('#26233A', { roughness: 0.4 }), 0, 0.06, 0);
    A(sph(0.075, 14, 10), mat('#D8DCE8', { roughness: 0.25, metalness: 0.5 }), 0, 0.25, 0);
  } else if (st === 'paleta') {
    A(cyl(0.02, 0.02, 0.62, 8), mat('#FFFFFF'), 0, 0.22, 0);
    const d = A(cyl(0.24, 0.24, 0.05, 28), mat('#FF6FAE', { roughness: 0.3 }), 0, 0.66, 0); d.rotation.x = Math.PI / 2;
    [0.07, 0.15].forEach((r, i) => A(G(`sw${r}`, () => new THREE.TorusGeometry(r, 0.022, 8, 24)), mat(i ? '#FFFFFF' : '#FFD23F'), 0, 0.66, 0.03));
  } else if (st === 'espada') {
    A(rbox(0.09, 0.82, 0.035, 0.03), mat('#8FD3FF', { roughness: 0.4 }), 0, 0.55, 0);
    A(rbox(0.3, 0.07, 0.09, 0.03), mat('#FFD23F'), 0, 0.12, 0);
    A(cyl(0.035, 0.035, 0.18, 8), mat('#A77BF3'), 0, 0.0, 0);
  } else if (st === 'escoba') {
    A(cyl(0.025, 0.025, 1.3, 8), mat('#9A6A45'), 0, 0.05, 0);
    A(cone(0.2, 0.4, 12), mat('#E8C07A', { roughness: 1 }), 0, -0.72, 0);
    A(cyl(0.07, 0.07, 0.06, 10), mat('#FF6FAE'), 0, -0.52, 0);
  } else if (st === 'globo') {
    A(cyl(0.006, 0.006, 1.2, 4), mat('#FFFFFF'), 0, 0.6, 0);
    const b = A(sph(0.3, 18, 14), mat(pick(['#FF6FAE', '#4FB6F5', '#FFD23F', '#A77BF3']), { roughness: 0.2 }), 0, 1.45, 0); b.scale.set(1, 1.15, 1);
    A(cone(0.05, 0.07, 8), mat('#FF6FAE'), 0, 1.1, 0);
  } else if (st === 'girasol') {
    A(cyl(0.025, 0.025, 0.7, 8), mat('#4FA85A'), 0, 0.28, 0);
    const c = A(cyl(0.12, 0.12, 0.05, 20), mat('#6D4A30'), 0, 0.68, 0.02); c.rotation.x = Math.PI / 2;
    for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, pe = A(sph(0.08, 8, 6), mat('#FFD23F'), Math.cos(a) * 0.19, 0.68 + Math.sin(a) * 0.19, 0); pe.scale.set(1.3, 0.7, 0.4); pe.rotation.z = a; }
  } else if (st === 'baguette') {
    const b = A(rbox(0.12, 0.8, 0.12, 0.06), mat('#E0A55A', { roughness: 0.9 }), 0, 0.25, 0);
    [0.05, 0.25, 0.45].forEach(y => { const s = A(box(0.08, 0.02, 0.02), mat('#F6D9A6'), 0, y, 0.06); s.rotation.z = 0.5; });
  } else if (st === 'pescado') {
    const f = A(sph(0.12, 14, 10), mat('#FF9B4A', { roughness: 0.35 }), 0, 0.28, 0); f.scale.set(0.7, 2.0, 1.1);
    const t = A(cone(0.13, 0.2, 3), mat('#FF9B4A', { roughness: 0.35 }), 0, 0.0, 0); t.rotation.x = Math.PI; t.scale.z = 0.35;
    [-1, 1].forEach(s => A(sph(0.025, 6, 5), mat('#26233A'), s * 0.07, 0.46, 0.06));
  } else if (st === 'disco') {
    addMirrorBall(p, R);
  } else if (st === 'pollo') {
    const y = mat('#FFE45C', { roughness: 0.4 });
    const b = A(sph(0.11, 12, 10), y, 0, 0.26, 0); b.scale.set(1, 2.1, 0.9);
    A(sph(0.08, 12, 10), y, 0, 0.56, 0.02);
    A(cone(0.03, 0.08, 6), mat('#FF9B4A'), 0, 0.55, 0.11).rotation.x = Math.PI / 2;
    [0, 1, 2].forEach(i => A(sph(0.025, 6, 5), mat('#FF3B4E'), 0, 0.64 + i * 0.012, -0.03 + i * 0.03));
    [-1, 1].forEach(s => A(cyl(0.012, 0.012, 0.14, 5), mat('#FF9B4A'), s * 0.04, 0.0, 0));
  }
  R.armR.add(p);
}

// denim vest over a t-shirt in the chosen colour
function addVest(body, R, ty, topM) {
  const denim = mat('#4F7DBF', { roughness: 0.9 }), dk = mat('#3B5F93', { roughness: 0.9 });
  body.add(mesh(rbox(0.76, 0.7, 0.44, 0.16), denim, 0, ty + 0.37, 0));
  body.add(mesh(rbox(0.2, 0.62, 0.03, 0.02), topM, 0, ty + 0.4, 0.215));
  [-1, 1].forEach(s => { const l = mesh(rbox(0.1, 0.32, 0.03, 0.02), dk, s * 0.14, ty + 0.58, 0.225); l.rotation.z = s * 0.35; body.add(l); });
  const patches = [['#FF6FAE', -0.24, 0.26], ['#FFD23F', 0.24, 0.5], ['#34CFA0', 0.22, 0.18]];
  patches.forEach(([c, x, y], i) => { const p = i === 1 ? mesh(starGeo(), mat(c), x, ty + y, 0.215) : mesh(rbox(0.12, 0.1, 0.02, 0.02), mat(c), x, ty + y, 0.225); if (i === 1) p.scale.setScalar(0.7); body.add(p); });
  body.add(mesh(heartGeo(), mat('#FF4F5E'), -0.02, ty + 0.4, -0.25).rotateY(Math.PI));
}

/* face paint: small flat decals that sit on the curve of the face */
const _Z = new THREE.Vector3(0, 0, 1), _n = new THREE.Vector3();
function decal(head, obj, x, y, rz = 0, s = 1) {
  const a = 0.46, b = 0.437;
  const z = b * Math.sqrt(Math.max(0.05, 1 - (x / a) ** 2 - (y / b) ** 2)) + 0.006;
  _n.set(x / (a * a), y / (b * b), z / (b * b)).normalize();
  obj.position.set(x, y, z); obj.quaternion.setFromUnitVectors(_Z, _n); obj.rotateZ(rz); obj.scale.multiplyScalar(s);
  obj.traverse(o => { o.castShadow = false; });
  head.add(obj);
}
const tstripe = () => G('tstripe', () => new THREE.ConeGeometry(0.02, 0.13, 3).rotateZ(Math.PI / 2));
const disc = r => G(`disc${r}`, () => new THREE.CircleGeometry(r, 16));
function addPaint(head, paint) {
  const st = paint && paint.style; if (!st || st === 'ninguno') return;
  const M = (c, e) => mat(c, e ? { roughness: 0.3, emissive: c, emissiveIntensity: 0.35 } : { roughness: 0.6 });
  if (st === 'estrellitas') {
    [-1, 1].forEach(s => [[0.29, -0.06, 0.55], [0.22, -0.17, 0.4], [0.35, -0.17, 0.35]].forEach(([x, y, k]) => decal(head, new THREE.Mesh(starGeo(), M('#FFD23F', true)), s * x, y, s * 0.3, k)));
  } else if (st === 'notas') {
    [[-0.28, -0.08, 1], [-0.19, -0.18, 0.8]].forEach(([x, y, k]) => {
      const g = new THREE.Group(), m = M('#8E6BD8');
      const hd = new THREE.Mesh(disc(0.026), m); hd.position.set(0, -0.035, 0); g.add(hd);
      const st1 = new THREE.Mesh(box(0.009, 0.075, 0.004), m); st1.position.set(0.021, 0.002, 0); g.add(st1);
      const fl = new THREE.Mesh(box(0.03, 0.012, 0.004), m); fl.position.set(0.034, 0.035, 0); fl.rotation.z = -0.5; g.add(fl);
      decal(head, g, x, y, 0.15, k);
    });
  } else if (st === 'gatito') {
    const m = M('#2A2438');
    decal(head, new THREE.Mesh(disc(0.035), m), 0, -0.06, 0, 1);
    [-1, 1].forEach(s => [-0.25, 0, 0.25].forEach(a => decal(head, new THREE.Mesh(box(0.13, 0.009, 0.004), m), s * 0.3, -0.1 + a * 0.12, s * a, 1)));
  } else if (st === 'mariposa') {
    const g = new THREE.Group();
    [[-1, '#FF6FAE'], [1, '#A77BF3']].forEach(([s, c]) => {
      const up = new THREE.Mesh(disc(0.045), M(c)); up.position.set(s * 0.04, 0.02, 0); up.scale.set(1, 1.2, 1); g.add(up);
      const lo = new THREE.Mesh(disc(0.03), M(tint(c, 0.3))); lo.position.set(s * 0.032, -0.035, 0); g.add(lo);
    });
    const bd = new THREE.Mesh(box(0.012, 0.09, 0.004), M('#2A2438')); g.add(bd);
    decal(head, g, 0.28, -0.1, -0.2, 1);
  } else if (st === 'arcoiris') {
    RAINBOW.slice(0, 5).forEach((c, i) => decal(head, new THREE.Mesh(G(`rb${i}`, () => new THREE.RingGeometry(0.03 + i * 0.012, 0.041 + i * 0.012, 20, 1, 0, Math.PI)), M(c)), -0.28, -0.13, 0, 1));
  } else if (st === 'pecas') {
    [[0, -0.05], [0.07, -0.07], [-0.07, -0.07], [0.22, -0.09], [0.28, -0.13], [0.33, -0.07], [-0.22, -0.09], [-0.28, -0.13], [-0.33, -0.07]].forEach(([x, y]) => decal(head, new THREE.Mesh(disc(0.014), M('#E0A83A', true)), x, y, 0, 1));
  } else if (st === 'tigre') {
    const m = M('#FF8A2A');
    [-1, 1].forEach(s => [[0.33, -0.05, 0.2], [0.34, -0.14, -0.1], [0.3, -0.22, -0.4]].forEach(([x, y, a]) => { const t = new THREE.Mesh(tstripe(), m); t.scale.z = 0.1; decal(head, t, s * x, y, s < 0 ? Math.PI - a : a, 1); }));
    [-0.08, 0, 0.08].forEach(x => { const t = new THREE.Mesh(tstripe(), m); t.scale.z = 0.1; decal(head, t, x, 0.2 + (x ? -0.02 : 0), Math.PI / 2, 0.8); });
  }
}

const SAVE_KEY = 'ciudadArcoiris.v1';
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return s && s.outfit ? s : null; } catch (e) { return null; } }
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ outfit: player.ch.outfit, pets: player.pets.map(p => ({ kind: p.kind, color: p.color, name: p.name })) })); } catch (e) { }
}
function fixOutfit(o) {
  const d = DEFAULT_OUTFIT, r = JSON.parse(JSON.stringify(d));
  if (!o) return r;
  if (Number.isInteger(o.skin) && o.skin >= 0 && o.skin < SKIN.length) r.skin = o.skin;
  ['hair', 'top', 'bottom', 'shoes', 'head', 'back', 'face', 'costume', 'prop', 'paint'].forEach(k => { if (o[k] && typeof o[k] === 'object') Object.assign(r[k], o[k]); });
  return r;
}

let mode = 'intro'; // intro | play | closet | pets
const player = { ch: null, pos: new THREE.Vector3(9, 0, -1.5), vel: new THREE.Vector3(), facing: Math.PI * 0.8, vy: 0, y: 0, air: false, phase: 0, speed01: 0, wave: 0, happy: 0, iceTime: 0, pets: [] };
const cam = { yaw: 0.35, pitch: 0.36, dist: 11.5, look: new THREE.Vector3(), pos: new THREE.Vector3(), closetYaw: 0 };
const input = { jx: 0, jy: 0, jump: false, keys: {} };
const npcs = [];
let clock = 0;

function collide(p, r, skip) {
  for (const o of obstacles) {
    if (o === skip) continue;
    if (Math.abs(p.x - o.x) > o.hw + r || Math.abs(p.z - o.z) > o.hd + r) continue;
    const cx = clamp(p.x, o.x - o.hw, o.x + o.hw), cz = clamp(p.z, o.z - o.hd, o.z + o.hd);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
    else {
      const px = o.hw - Math.abs(p.x - o.x), pz = o.hd - Math.abs(p.z - o.z);
      if (px < pz) p.x += Math.sign(p.x - o.x || 1) * (px + r); else p.z += Math.sign(p.z - o.z || 1) * (pz + r);
    }
  }
}

function addPet(kind, color, name, pos) {
  const obj = buildPet(kind, color);
  setPetName(obj, name);
  scene.add(obj.root);
  const p = { kind, color, name, obj, pos: (pos || player.pos).clone(), facing: player.facing };
  if (!pos) { p.pos.x -= Math.sin(player.facing) * (1.6 + player.pets.length * 1.3); p.pos.z -= Math.cos(player.facing) * (1.6 + player.pets.length * 1.3); }
  player.pets.push(p);
  return p;
}

function updatePlayer(dt) {
  if (mode === 'drive') { updateCar(dt); return; }
  let jx = 0, jy = 0;
  if (mode === 'play') {
    jx = input.jx; jy = input.jy;
    const k = input.keys;
    const kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    const ky = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); jx = kx / l; jy = ky / l; }
  }
  let mag = Math.hypot(jx, jy);
  if (mag < 0.14) { jx = jy = 0; mag = 0; } else if (mag > 1) { jx /= mag; jy /= mag; }
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const dx = rx * jx - fx * jy, dz = rz * jx - fz * jy;
  const rig = player.ch.rig;
  const maxSpeed = rig.skates ? 9 : 6.5;
  const acc = 1 - Math.exp(-dt * (mag > 0 ? (rig.skates ? 4 : 10) : (rig.skates ? 2.5 : 12)));
  player.vel.x += (dx * maxSpeed - player.vel.x) * acc;
  player.vel.z += (dz * maxSpeed - player.vel.z) * acc;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  collide(player.pos, 0.5);
  for (const n of npcs) { // gently step around neighbours
    const ex = player.pos.x - n.pos.x, ez = player.pos.z - n.pos.z, d = Math.hypot(ex, ez);
    if (d < 0.9 && d > 1e-4) { player.pos.x += ex / d * (0.9 - d); player.pos.z += ez / d * (0.9 - d); }
  }
  player.pos.x = clamp(player.pos.x, -73, 73); player.pos.z = clamp(player.pos.z, -73, 73);
  const sp = Math.hypot(player.vel.x, player.vel.z);
  if (sp > 0.4 && mode === 'play') player.facing = lerpAngle(player.facing, Math.atan2(player.vel.x, player.vel.z), 1 - Math.exp(-dt * 12));
  if (input.jump && !player.air && mode === 'play') { player.vy = 8.2; player.air = true; sfx('jump'); }
  input.jump = false;
  if (player.air) { player.vy -= 24 * dt; player.y += player.vy * dt; if (player.y <= 0) { player.y = 0; player.vy = 0; player.air = false; } }
  player.speed01 = clamp(sp / 6.5, 0, 1);
  player.phase += dt * sp * (rig.skates ? 0.9 : 2.1);
  player.wave = Math.max(0, player.wave - dt);
  player.happy = Math.max(0, player.happy - dt);
  if (player.iceTime > 0) { player.iceTime -= dt; if (player.iceTime <= 0) { player.ch.holding = null; dressCharacter(player.ch, player.ch.outfit); } }
  player.ch.root.position.set(player.pos.x, player.y, player.pos.z);
  player.ch.root.rotation.y = player.facing;
  animateRig(player.ch.rig, { speed01: player.speed01, phase: player.phase, t: clock, air: player.air, wave: player.wave, happy: player.happy, hold: !!player.ch.holding });
}

function followChain(list, leaderPos, dt, t, firstGap = 1.7) {
  let leader = leaderPos;
  list.forEach((p, i) => {
    const dx = leader.x - p.pos.x, dz = leader.z - p.pos.z, d = Math.hypot(dx, dz);
    const want = i === 0 ? firstGap : 1.35;
    let moved = 0;
    if (d > 30) { p.pos.set(leader.x - dx / d * want, 0, leader.z - dz / d * want); }
    else if (d > want) { const step = Math.min(d - want, Math.min(26, Math.max(d > 5 ? 13 : 8.5, (d - want) * 3.2)) * dt); p.pos.x += dx / d * step; p.pos.z += dz / d * step; moved = step / Math.max(dt, 1e-4); }
    collide(p.pos, 0.35);
    if (d > 0.05) p.facing = lerpAngle(p.facing, Math.atan2(dx, dz), 1 - Math.exp(-dt * 8));
    p.obj.root.position.set(p.pos.x, 0, p.pos.z); p.obj.root.rotation.y = p.facing;
    animatePet(p.obj, t + i, clamp(moved / 5, 0, 3), dt);
    leader = p.pos;
  });
}

/* ---------- neighbours ---------- */
const NPC_LINES = ['¡Hola!', '¡Qué linda tu ropa!', '¡Buen día!', '¿Vamos al parque?', '¡Me encanta tu peinado!', '¡Qué día tan lindo!', '¡Chao, que te vaya bien!'];
function npcTarget(n) {
  if (Math.random() < 0.3) { if (Math.random() < 0.5) n.sx *= -1; else n.sz *= -1; }
  else {
    const o = [];
    if (n.i > 0) o.push([n.i - 1, n.j]); if (n.i < 2) o.push([n.i + 1, n.j]); if (n.j > 0) o.push([n.i, n.j - 1]); if (n.j < 2) o.push([n.i, n.j + 1]);
    const [a, b] = pick(o); n.i = a; n.j = b;
  }
  n.target.set(LINES[n.i] + n.sx * WALK, 0, LINES[n.j] + n.sz * WALK);
}
function spawnNPCs(count) {
  const r = seeded(1234);
  for (let k = 0; k < count; k++) {
    const i = Math.floor(r() * 3), j = Math.floor(r() * 3), sx = r() < 0.5 ? -1 : 1, sz = r() < 0.5 ? -1 : 1;
    const n = { ch: makeCharacter(randomOutfit()), i, j, sx, sz, pos: new THREE.Vector3(LINES[i] + sx * WALK, 0, LINES[j] + sz * WALK), target: new THREE.Vector3(), facing: r() * TAU, phase: 0, wait: r() * 2, speed: 1.9 + r() * 0.9, greet: 0, cool: r() * 4, bubble: null, pets: [] };
    // start somewhere along a sidewalk rather than all on corners
    npcTarget(n); n.pos.lerp(n.target, r() * 0.8);
    if (k % 3 === 0) {
      const obj = buildPet(pick(['perro', 'gato', 'conejo']), pick(PET_COLORS)); scene.add(obj.root);
      n.pets.push({ obj, pos: n.pos.clone(), facing: 0 });
    }
    npcs.push(n);
  }
}
function npcSay(n, text) {
  if (n.bubble) n.ch.root.remove(n.bubble);
  n.bubble = labelSprite(text, { bubble: true, scale: 0.0062 }); n.bubble.position.y = 3.0; n.ch.root.add(n.bubble);
}
function updateNPCs(dt, t) {
  for (const n of npcs) {
    const px = player.pos.x - n.pos.x, pz = player.pos.z - n.pos.z, pd = Math.hypot(px, pz);
    n.cool -= dt;
    if (pd < 3.4 && n.cool <= 0 && mode === 'play') {
      n.greet = 2.8; n.cool = 14;
      npcSay(n, player.pets.length && Math.random() < 0.4 ? '¡Qué linda tu mascota!' : pick(NPC_LINES));
    }
    let moving = false;
    if (n.greet > 0) {
      n.greet -= dt;
      n.facing = lerpAngle(n.facing, Math.atan2(px, pz), 1 - Math.exp(-dt * 8));
      if (n.greet <= 0 && n.bubble) { n.ch.root.remove(n.bubble); n.bubble = null; }
    } else if (n.wait > 0) n.wait -= dt;
    else {
      const dx = n.target.x - n.pos.x, dz = n.target.z - n.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.15) { if (Math.random() < 0.35) n.wait = 1 + Math.random() * 2.5; npcTarget(n); }
      else {
        const st = Math.min(d, n.speed * dt), nx = n.pos.x + dx / d * st, nz = n.pos.z + dz / d * st;
        if (cars.some(c => { const dn = Math.hypot(nx - c.x, nz - c.z); return dn < 2.6 && dn < Math.hypot(n.pos.x - c.x, n.pos.z - c.z); })) { n.blocked = (n.blocked || 0) + dt; if (n.blocked > 1.2) { n.blocked = 0; npcTarget(n); } }
        else { n.blocked = 0; n.pos.x = nx; n.pos.z = nz; moving = true; }
        n.facing = lerpAngle(n.facing, Math.atan2(dx, dz), 1 - Math.exp(-dt * 10));
      }
    }
    if (moving) n.phase += dt * n.speed * 2.1;
    n.ch.root.position.set(n.pos.x, 0, n.pos.z); n.ch.root.rotation.y = n.facing;
    animateRig(n.ch.rig, { speed01: moving ? clamp(n.speed / 6.5 * 1.7, 0, 1) : 0, phase: n.phase, t: t + n.speed * 3, wave: n.greet > 0.9 ? 1 : 0, happy: 0 });
    if (n.pets.length) followChain(n.pets, n.pos, dt, t);
  }
}

/* ---------- places ---------- */
function areaName(x, z) {
  const inB = (x0, x1, z0, z1) => x > x0 && x < x1 && z > z0 && z < z1;
  if (inB(-34.5, -5.5, -34.5, -5.5)) return 'Parque Central';
  if (inB(5.5, 34.5, -34.5, -5.5)) return 'Boutique Arcoíris';
  if (inB(5.5, 34.5, 5.5, 34.5)) return 'Refugio de Mascotas';
  if (inB(-34.5, -5.5, 5.5, 21)) return 'Heladería';
  if (inB(-34.5, -5.5, 21, 34.5)) return 'Mi Casa';
  for (const L of LINES) { if (Math.abs(x - L) < 5.6) return STREET.x[L]; if (Math.abs(z - L) < 5.6) return STREET.z[L]; }
  return 'Barrio Arcoíris';
}
let currentZone = null;
function updateZones() {
  let found = null;
  if (mode === 'play') for (const q of zones) if (Math.hypot(player.pos.x - q.x, player.pos.z - q.z) < q.r) { found = q; break; }
  if (mode === 'play' && !found) { const c = nearestCar(3.4); if (c) found = c.zone; }
  if (found !== currentZone) { currentZone = found; setActionButton(found); }
}

/* ---------- camera ---------- */
const _look = new THREE.Vector3(), _pos = new THREE.Vector3();
function cameraBlock(look, yaw, pitch, dist) {
  // shorten the boom if a building stands between the player and the camera
  let best = dist;
  const cp = Math.cos(pitch);
  for (let i = 1; i <= 14; i++) {
    const f = i / 14 * dist;
    const x = look.x + Math.sin(yaw) * cp * f, z = look.z + Math.cos(yaw) * cp * f, y = look.y + Math.sin(pitch) * f;
    for (const o of obstacles) {
      if (!o.h || y > o.h) continue;
      if (Math.abs(x - o.x) < o.hw + 0.4 && Math.abs(z - o.z) < o.hd + 0.4) { best = Math.max(3, f * 0.85); return best; }
    }
  }
  return best;
}

let driving = null;

const _cp = new THREE.Vector3();
