function updateCar(dt) {
  const c = driving;
  let jx = input.jx, jy = input.jy;
  const k = input.keys;
  const kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  const ky = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  if (kx || ky) { jx = kx; jy = ky; }
  let mag = Math.min(1, Math.hypot(jx, jy));
  if (mag < 0.14) { jx = jy = 0; mag = 0; }
  const brake = input.brake || k.Space;
  // pushing up or sideways drives forward; pulling down brakes, then backs up
  const back = jy > 0.45 && Math.abs(jx) < 0.7;
  if (brake || back) {
    if (c.speed > 0.4) c.speed -= DRIVE.brake * dt;
    else c.speed = Math.max(-DRIVE.rev, c.speed - 6 * dt);
  } else if (mag > 0) {
    c.speed += (c.speed < 0 ? DRIVE.brake : DRIVE.acc * (c.speed > 10 ? 0.6 : 1)) * mag * dt;
  } else c.speed -= Math.sign(c.speed) * Math.min(Math.abs(c.speed), DRIVE.drag * dt);
  c.speed = clamp(c.speed, -DRIVE.rev, DRIVE.max * (mag > 0 || brake ? Math.max(0.35, mag) : 1));

  c.steer = lerp(c.steer, jx, 1 - Math.exp(-dt * 7));
  const grip = clamp(Math.abs(c.speed) / 4, 0, 1) * (c.speed >= 0 ? 1 : -1);
  c.heading -= c.steer * 2.2 * grip * dt;

  c.x += Math.sin(c.heading) * c.speed * dt;
  c.z += Math.cos(c.heading) * c.speed * dt;
  // bump into houses, trees, other cars and neighbours (two circles along the car)
  let px = 0, pz = 0;
  const fx = Math.sin(c.heading), fz = Math.cos(c.heading);
  for (const s of [-1.05, 1.05]) {
    const ox = c.x + fx * s, oz = c.z + fz * s;
    _cp.set(ox, 0, oz); collide(_cp, 1.12, c.obs);
    px += _cp.x - ox; pz += _cp.z - oz;
  }
  for (const n of npcs) {
    const dx = c.x - n.pos.x, dz = c.z - n.pos.z, d = Math.hypot(dx, dz);
    if (d < 2.4 && d > 1e-4) { px += dx / d * (2.4 - d); pz += dz / d * (2.4 - d); }
  }
  const push = Math.hypot(px, pz);

    c.x += px; c.z += pz;
    if (Math.abs(c.speed) > 3 && c.bump <= 0) { sfx('bonk'); c.bump = 0.4; c.shell.position.y = 0.12; }
    c.speed *= Math.abs(c.speed) > 3 ? 0.35 : 0.8;
  }
  c.bump -= dt;
  c.x = clamp(c.x, -73, 73); c.z = clamp(c.z, -73, 73);
  syncCar(c);

  // a little body roll and bounce, spinning wheels
  const sp01 = c.speed / DRIVE.max;
  c.shell.rotation.z = lerp(c.shell.rotation.z, c.steer * 0.08 * clamp(sp01 * 2, -1, 1), 1 - Math.exp(-dt * 6));
  c.shell.rotation.x = lerp(c.shell.rotation.x, -(brake ? 0.04 : 0) * Math.sign(c.speed), 1 - Math.exp(-dt * 6));
  c.shell.position.y = lerp(c.shell.position.y, Math.abs(Math.sin(clock * 18)) * 0.02 * Math.abs(sp01), 1 - Math.exp(-dt * 10));

}

let AC = null, master, musicGain, sfxGain, noiseBuf, musicOn = true, seqTimer = null, nextTime = 0, step = 0;

const CHORDS = [[48, 64, 67, 72], [43, 62, 67, 71], [45, 64, 69, 72], [41, 65, 69, 72]];

  return '<div class="sws">' + list.map((c, i) => {
    const v = key === 'skin' ? i : c, on = key === 'skin' ? i === cur : c.toLowerCase() === String(cur).toLowerCase();
    return `<button class="sw${on ? ' on' : ''}" style="background:${c}" data-k="${key}" data-v="${v}" aria-label="Color ${i + 1}"></button>`;
  }).join('') + '</div>';
}
function renderTabs() { tabsEl.innerHTML = TABS.map(t => `<button class="tab${t.id === closetTab ? ' on' : ''}" data-tab="${t.id}">${t.label}</button>`).join(''); }
function renderCloset() {
  const o = player.ch.outfit, dress = o.top.style === 'vestido';
  let h = '';
  const C = COSTUME_DEFS[o.costume.style];
  if (closetTab === 'costume') {
    h = '<h3>Disfraz</h3>' + optsHTML(COSTUME_LIST, o.costume.style, 'costume.style');
    if (C && C.tint) h += '<h3>Color del disfraz</h3>' + swHTML(CLOTH_COLORS, o.costume.color || C.color, 'costume.color');
    h += '<p class="note">El disfraz se pone encima de tu ropa. Para quitártelo, elige "Sin disfraz".</p>';
  }
  else if (closetTab === 'prop') h = '<h3>Para llevar en la mano</h3>' + optsHTML(PROP_LIST, o.prop.style, 'prop.style') + (player.ch.holding ? '<p class="note">Ahora tienes un helado en la mano. Cuando te lo termines, vas a ver tu objeto.</p>' : '');
  else if (closetTab === 'top') h = '<h3>Prenda</h3>' + optsHTML(STYLES.top, o.top.style, 'top.style') + '<h3>Color</h3>' + swHTML(CLOTH_COLORS, o.top.color, 'top.color') + '<h3>Dibujo</h3>' + optsHTML(STYLES.print, o.top.print, 'top.print');
  else if (closetTab === 'bottom') h = '<h3>Prenda</h3>' + optsHTML(STYLES.bottom, dress ? '' : o.bottom.style, 'bottom.style') + (dress ? '<p class="note">Llevas un vestido. Si eliges algo de aquí, el vestido cambia por una polera.</p>' : '') + '<h3>Color</h3>' + swHTML(CLOTH_COLORS, o.bottom.color, 'bottom.color');
  else if (closetTab === 'eyes') h = '<h3>Forma de ojos</h3>' + optsHTML(STYLES.eyes, o.face.eyes, 'face.eyes') + '<h3>Color de ojos</h3>' + swHTML(EYE_COLORS, o.face.eyeColor, 'face.eyeColor');
  else if (closetTab === 'paint') h = '<h3>Pintura de cara</h3>' + optsHTML(STYLES.paint, o.paint.style, 'paint.style');
  else if (closetTab === 'mouth') h = '<h3>Expresión</h3>' + optsHTML(STYLES.mouth, o.face.mouth, 'face.mouth');
  else if (closetTab === 'hair') h = '<h3>Peinado</h3>' + optsHTML(STYLES.hair, o.hair.style, 'hair.style') + '<h3>Color de pelo</h3>' + swHTML(HAIR_COLORS, o.hair.color, 'hair.color');
  else if (closetTab === 'shoes') h = '<h3>Calzado</h3>' + optsHTML(STYLES.shoes, o.shoes.style, 'shoes.style') + '<h3>Color</h3>' + swHTML(SHOE_COLORS, o.shoes.color, 'shoes.color');
  else if (closetTab === 'head') h = '<h3>Accesorio</h3>' + optsHTML(STYLES.head, o.head.style, 'head.style') + '<h3>Color</h3>' + swHTML(ACC_COLORS, o.head.color, 'head.color');
  else if (closetTab === 'back') h = '<h3>En la espalda</h3>' + optsHTML(STYLES.back, o.back.style, 'back.style') + '<h3>Color</h3>' + swHTML(ACC_COLORS, o.back.color, 'back.color');
  else h = '<h3>Tono de piel</h3>' + swHTML(SKIN, o.skin, 'skin');
  if (C && C.hides.includes(closetTab)) h = '<p class="note">Tu disfraz tapa esta parte. Si eliges algo aquí, te quitas el disfraz.</p>' + h;
  closetBody.innerHTML = h;
}
function applyOutfit(o) { dressCharacter(player.ch, o); player.happy = 0.6; sfx('pop'); save(); }
tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; closetTab = b.dataset.tab; renderTabs(); renderCloset(); closetBody.scrollTop = 0; sfx('pop'); });
closetBody.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const o = JSON.parse(JSON.stringify(player.ch.outfit)); const [a, c] = b.dataset.k.split('.'); const v = b.dataset.v;
  if (a === 'skin') o.skin = +v; else o[a][c] = v;
  if (a === 'bottom' && c === 'style' && o.top.style === 'vestido') o.top.style = 'polera';
  if (a === 'costume' && c === 'style') o.costume.color = '';
  const Cd = COSTUME_DEFS[o.costume.style];
  if (Cd && a !== 'costume' && Cd.hides.includes(a)) o.costume.style = 'ninguno';
  applyOutfit(o); renderCloset();
});
$('#btnRandom').addEventListener('click', () => { const r = randomOutfit(player.ch.outfit.skin); r.face = player.ch.outfit.face; applyOutfit(r); renderCloset(); });
function openCloset() { if (mode !== 'play') return; enterMenu('closet'); closet.hidden = false; renderTabs(); renderCloset(); }
$('#closetDone').addEventListener('click', () => { closet.hidden = true; leaveMenu(); toast('¡Te ves genial!'); });

/* ---------- pet shelter ---------- */
const petPanel = $('#petPanel'), petBody = $('#petBody');
const MAX_PETS = 4;
let petSel = { kind: 'perro', color: '#E9B77A', name: '' }, petSuggest = 'Toby', preview = null;
function makePreview() {
  if (preview) disposePet(preview);
  preview = buildPet(petSel.kind, petSel.color); setPetName(preview, petSel.name.trim() || petSuggest); scene.add(preview.root);
}
function renderPets() {
  const list = player.pets.length
    ? '<div class="mypets">' + player.pets.map((p, i) => `<div class="mypet"><span class="ic">${PET_KINDS.find(k => k.id === p.kind).ic}</span><b>${esc(p.name)}</b><button class="toy" data-rm="${i}">Llevar a casa</button></div>`).join('') + '</div>'
    : '<p class="empty">Todavía no tienes mascotas. ¡Elige una y adóptala!</p>';
  petBody.innerHTML = '<h3>Elige tu mascota</h3>' + optsHTML(PET_KINDS, petSel.kind, 'pk') +
    '<h3>Color</h3>' + swHTML(PET_COLORS, petSel.color, 'pc') +
    `<h3>Nombre</h3><input id="petName" maxlength="12" autocomplete="off" placeholder="${esc(petSuggest)}" value="${esc(petSel.name)}">` +
    `<h3>Mis mascotas (${player.pets.length}/${MAX_PETS})</h3>` + list;
}
petBody.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { const i = +rm.dataset.rm, p = player.pets[i]; disposePet(p.obj); player.pets.splice(i, 1); save(); toast(`${p.name} se fue a descansar a casa`); renderPets(); return; }
  const b = e.target.closest('[data-k]'); if (!b) return;
  if (b.dataset.k === 'pk') petSel.kind = b.dataset.v; else petSel.color = b.dataset.v;
  sfx('pop'); renderPets(); makePreview();
});
petBody.addEventListener('input', e => { if (e.target.id === 'petName') { petSel.name = e.target.value; setPetName(preview, petSel.name.trim() || petSuggest); } });
$('#btnAdopt').addEventListener('click', () => {
  if (player.pets.length >= MAX_PETS) { toast('Ya tienes 4 mascotas. Lleva una a casa para adoptar otra.'); return; }
  const name = petSel.name.trim() || petSuggest;
  addPet(petSel.kind, petSel.color, name, preview.root.position.clone());
  save(); sfx('adopt'); player.happy = 0.6;
  toast(`¡${name} ahora es tu mascota!`);
  petSel.name = ''; petSuggest = pick(PET_NAMES.filter(n => !player.pets.some(p => p.name === n)).concat(['Pompón']));
  renderPets(); makePreview();
});
function openPets() {
  if (mode !== 'play') return; enterMenu('pets'); petPanel.hidden = false;
  petSel.name = ''; petSuggest = pick(PET_NAMES); renderPets(); makePreview();
}
$('#petDone').addEventListener('click', () => { petPanel.hidden = true; if (preview) { disposePet(preview); preview = null; } leaveMenu(); });
function updatePreview(dt, t) {
  if (!preview) return;
  const yaw = cam.closetYaw, fx = Math.sin(yaw), fz = Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  preview.root.position.set(player.pos.x + fx * 1.4 + rx * 1.1, 0, player.pos.z + fz * 1.4 + rz * 1.1);
  preview.root.rotation.y = yaw - 0.5 + Math.sin(t * 0.8) * 0.3;
  animatePet(preview, t, 0, dt);
}

/* ================= LOOP & BOOT ================= */
let last = performance.now(), placeT = 0;
const placeName = $('#placeName');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  updatePlayer(dt);
  followChain(player.pets, player.pos, dt, clock, mode === 'drive' ? 3.8 : 1.7);
  updateNPCs(dt, clock);
  updatePreview(dt, clock);
  updateZones();
  for (const f of animated) f(clock, dt);
  updateCamera(dt);
  sky.position.copy(camera.position);
  placeT -= dt; if (placeT <= 0) { placeT = 0.3; placeName.textContent = areaName(player.pos.x, player.pos.z); }
  renderer.render(scene, camera);
}
function resize() {
  const w = gameEl.clientWidth || window.innerWidth, h = gameEl.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1 ? 64 : 52; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

let sky;
async function boot() {
  try { await Promise.race([document.fonts ? document.fonts.load('800 40px "Baloo 2"') : null, new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  sky = buildSky(); buildClouds(); buildCity();
  const saved = loadSave();
  player.ch = makeCharacter(fixOutfit(saved && saved.outfit));
  const pets = saved ? (saved.pets || []) : [{ kind: 'perro', color: '#E9B77A', name: 'Toby' }];
  pets.slice(0, MAX_PETS).forEach(p => { if (PET_KINDS.some(k => k.id === p.kind)) addPet(p.kind, p.color || '#E9B77A', String(p.name || 'Toby').slice(0, 12)); });
  spawnNPCs(7);
  resize();
  cam.look.set(player.pos.x, 1.6, player.pos.z); cam.pos.set(player.pos.x + 8, 7, player.pos.z + 8);
  requestAnimationFrame(t => { last = t; frame(t); });
  const play = $('#btnPlay'); play.disabled = false; play.textContent = '¡A jugar!';
  play.addEventListener('click', () => {
    initAudio(); if (musicOn) startMusic();
    $('#start').hidden = true; gameEl.classList.remove('intro'); mode = 'play';
    cam.yaw = player.facing + Math.PI + 0.35; sfx('open');
  });
}
if (typeof THREE === 'undefined') { const b = $('#btnPlay'); b.textContent = 'No se pudo cargar el 3D. Revisa tu conexión.'; }
else boot().catch(err => { console.error(err); const b = $('#btnPlay'); b.textContent = 'Algo falló al construir la ciudad'; });

</script>
